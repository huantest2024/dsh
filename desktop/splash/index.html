<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>DeepSeek Harness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #181818;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    /* 本页严禁任何 -webkit-app-region：整页级 drag 区域会并进窗口判定区域且
       不随后续导航回收，毒化顶栏按钮的点击（bar.html 顶栏同款教训，弃用该机制） */
  }
  /* 整页过渡容器：退场时整体淡出。主界面同为 #181818 深底，换页无缝衔接 */
  #stage { position: fixed; inset: 0; }
  #stage.leaving { animation: stageOut 0.42s ease forwards; }
  @keyframes stageOut { to { opacity: 0; } }

  /* ---- 小肥鱼加载场景：居中构图，替代旧骨架屏 ----
     素材 = 壳图标（assets/icon_app.png，浅蓝圆环徽章内的 Q 版小肥鱼，
     与 GitHub 仓库图标同源），配「浮在水面等服务」的动效：
     徽章上下浮动 + 身后光晕呼吸 + 周围气泡上浮 + 下方水面涟漪。
     全部动画只用 transform/opacity（合成器路径），启动页不走 JS 循环。 */
  #scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding-bottom: 7vh; /* 视觉重心略上移，给下方状态行留呼吸 */
  }
  #pool { position: relative; width: 250px; height: 230px; flex: none; }

  /* 光晕：徽章身后一团淡蓝呼吸光，跟随浮动节奏 */
  #glow {
    position: absolute; left: 50%; top: 46%;
    width: 240px; height: 240px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(150, 182, 228, 0.16) 0%,
      rgba(150, 182, 228, 0.05) 45%,
      transparent 70%);
    animation: glow 3.2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.55; }
    50%      { transform: translate(-50%, -50%) scale(1.1);  opacity: 1; }
  }

  /* 小肥鱼本体：轻微浮沉 + 左右微倾，像漂在水面上 */
  #fish {
    position: absolute; left: 50%; top: 44%;
    width: 148px; height: 148px;
    margin: -74px 0 0 -74px;
    border-radius: 50%;
    animation: bob 3.2s ease-in-out infinite;
    filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.45));
    user-select: none; pointer-events: none;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(7px) rotate(-2deg); }
    50%      { transform: translateY(-9px) rotate(2deg); }
  }

  /* 水面涟漪：鱼下方一道椭圆微光，与浮动同节奏缩放 */
  #ripple {
    position: absolute; left: 50%; bottom: 2px;
    width: 150px; height: 24px;
    margin-left: -75px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      rgba(200, 220, 248, 0.12), transparent 65%);
    animation: ripple 3.2s ease-in-out infinite;
  }
  @keyframes ripple {
    0%, 100% { transform: scaleX(0.85); opacity: 0.5; }
    50%      { transform: scaleX(1.12); opacity: 0.15; }
  }

  /* 气泡：从鱼身边缘持续上浮，错峰循环 */
  .bub {
    position: absolute; bottom: 26px;
    width: var(--s, 8px); height: var(--s, 8px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
      rgba(215, 232, 252, 0.55), rgba(190, 215, 245, 0.16));
    opacity: 0;
    animation: rise var(--t, 3.6s) linear infinite;
    animation-delay: var(--d, 0s);
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(0.7); opacity: 0; }
    14%  { opacity: 0.75; }
    78%  { opacity: 0.35; }
    100% { transform: translateY(-128px) scale(1.3); opacity: 0; }
  }

  /* 状态区：进度条 + 状态行，居中放在场景下方 */
  #hud { margin-top: 30px; width: 100%; flex: none; text-align: center; }
  #progress {
    position: relative;
    width: 210px; height: 3px;
    margin: 0 auto;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }
  #progress::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 38%;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.38);
    animation: slide 1.15s cubic-bezier(.45, .05, .55, .95) infinite;
  }
  @keyframes slide {
    from { transform: translateX(-110%); }
    to   { transform: translateX(370%); }
  }
  #statusline {
    margin-top: 12px;
    font-size: 12px;
    line-height: 17px;
    color: rgba(255, 255, 255, 0.42);
    letter-spacing: 0.3px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #statusline .sep { margin: 0 7px; color: rgba(255, 255, 255, 0.16); }
  #status { display: inline; transition: opacity 0.16s ease; }
  #elapsed { color: rgba(255, 255, 255, 0.22); }

  /* gif 挂件：右下角，同主题挂件位（client-src.js mascot：right 14 / bottom 12 /
     圆角 14 / drop-shadow），宽约 110px，像贴在界面上的挂件 */
  #mascot {
    position: fixed; right: 14px; bottom: 12px;
    width: 110px; height: auto;
    border-radius: 14px;
    object-fit: cover;
    opacity: 0.92;
    filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.5));
    pointer-events: none; user-select: none;
    z-index: 10;
  }

  /* 减少动态偏好：全部动效停掉，只留静态徽章与状态行 */
  @media (prefers-reduced-motion: reduce) {
    #fish, #glow, #ripple, .bub, #progress::after { animation: none; }
    .bub { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="scene">
      <div id="pool">
        <div id="glow"></div>
        <span class="bub" style="left:34%; --s:7px;  --t:3.8s; --d:0s"></span>
        <span class="bub" style="left:58%; --s:9px;  --t:3.2s; --d:.9s"></span>
        <span class="bub" style="left:44%; --s:6px;  --t:4.4s; --d:1.7s"></span>
        <span class="bub" style="left:66%; --s:5px;  --t:3.5s; --d:2.3s"></span>
        <span class="bub" style="left:50%; --s:7px;  --t:4.1s; --d:2.9s"></span>
        <img id="fish" src="../assets/icon_app.png" alt="" draggable="false" />
        <div id="ripple"></div>
      </div>
      <div id="hud">
        <div id="progress"></div>
        <div id="statusline">
          <span id="status">正在启动服务 …</span><span class="sep">·</span><span id="elapsed">0.0 s</span><span class="sep" id="versep" hidden>·</span><span id="ver" hidden></span>
        </div>
      </div>
    </div>
    <img id="mascot" alt="" draggable="false" hidden />
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const gif = params.get('gif');
  if (gif) {
    const mascot = document.getElementById('mascot');
    mascot.src = 'file://' + gif.replace(/\\/g, '/');
    mascot.hidden = false;
  }
  const ver = params.get('ver');
  if (ver) {
    document.getElementById('ver').textContent = 'v' + ver;
    document.getElementById('ver').hidden = false;
    document.getElementById('versep').hidden = false;
  }

  const statusEl = document.getElementById('status');
  window.__setStatus = function (text) {
    if (statusEl.textContent === text) return;
    statusEl.style.opacity = '0';
    setTimeout(function () {
      statusEl.textContent = text;
      statusEl.style.opacity = '1';
    }, 160);
  };

  // 启动耗时计时（0.1s 步进），显示在状态行
  const elapsedEl = document.getElementById('elapsed');
  let t0 = Date.now();
  let timer = null;
  const startTimer = function () {
    clearInterval(timer);
    t0 = Date.now();
    timer = setInterval(function () {
      elapsedEl.textContent = ((Date.now() - t0) / 1000).toFixed(1) + ' s';
    }, 100);
  };
  startTimer();

  // 主进程在服务就绪、即将加载界面时调用：整页淡出（约 430ms）后再换页，
  // 时序与 main.js 的 withTimeout(splashOut(), 1200) 串行等待配套，不得缩短或异步化
  window.__splashOut = function () {
    return new Promise(function (resolve) {
      clearInterval(timer);
      document.getElementById('stage').classList.add('leaving');
      setTimeout(resolve, 430);
    });
  };

  // 淡出后需要回退重试（预热服务失联转自启动）时，恢复场景可见并重置计时
  window.__splashIn = function () {
    document.getElementById('stage').classList.remove('leaving');
    startTimer();
  };
</script>
</body>
</html>
