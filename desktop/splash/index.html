<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>DeepSeek Harness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0b0f16;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    /* 本页严禁任何 -webkit-app-region：整页级 drag 区域会并进窗口判定区域且
       不随后续导航回收，毒化顶栏按钮的点击（bar.html 顶栏同款教训，弃用该机制） */
  }
  #stage { position: fixed; inset: 0; }
  #stage.leaving { animation: stageOut 0.22s ease forwards; }
  @keyframes stageOut { to { opacity: 0; } }

  /* ============ 小肥鱼深海开场 · 电影版 ============
     参考社区三款启动动画的设计语言后重做（素材均为本项目自有）：
     - dsh-whale-intro：大尺度占场（38vh 徽章）、淡入浮入、连续交接
     - dsh-deepsea-echo：自检读数、声呐/雷达、扫描线 + RGB 分离、深海配色
     - dsh-whale-startup：候场表演 + 拍走欢呼的谢幕小 gag
     构成：全屏壁纸底（koi，暗调水中意境）+ 巨型鲸鱼徽章 + 遥测 HUD 环 +
           体积光束 + canvas 粒子场 + 终端打字机读数 + HUD 自检清单；
     入场约 1s（上浮 + 去模糊 + 环依次展开）；谢幕：蓄力 → 拍走（终端故障 +
           冲击波环）→ 居中放大 → 放射线 + 「开工！」→ 白闪淡出。 */

  /* ---- 壁纸底 + 暗角 + 中心压暗（保 HUD 可读）---- */
  #bg {
    position: absolute; inset: 0;
    background: url("../assets/splash-bg.jpg") center / cover no-repeat;
    transform: scale(1.06);
    animation: bgDrift 24s ease-in-out infinite alternate;
  }
  @keyframes bgDrift {
    from { transform: scale(1.06) translate(0, 0); }
    to   { transform: scale(1.1) translate(-1.2%, -1%); }
  }
  #scrim {
    position: absolute; inset: 0;
    background:
      radial-gradient(72% 62% at 50% 44%, rgba(6, 10, 18, 0.78) 0%, rgba(6, 10, 18, 0.42) 55%, rgba(6, 10, 18, 0.82) 100%),
      linear-gradient(180deg, rgba(6, 10, 18, 0.55) 0%, transparent 22%, transparent 68%, rgba(6, 10, 18, 0.72) 100%);
  }
  /* 体积光束：两道斜射光柱，缓慢摇摆 */
  .shaft {
    position: absolute;
    top: -18%;
    width: 15vw; height: 78%;
    background: linear-gradient(180deg, rgba(150, 210, 255, 0.13), rgba(150, 210, 255, 0) 72%);
    filter: blur(6px);
    transform-origin: 50% 0%;
    animation: shaftSway 11s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .shaft.s1 { left: 16%; }
  .shaft.s2 { left: 68%; width: 10vw; animation-delay: -5s; opacity: 0.7; }
  @keyframes shaftSway {
    from { transform: rotate(-7deg); }
    to   { transform: rotate(7deg); }
  }
  /* 粒子场画布 */
  #fx { position: absolute; inset: 0; pointer-events: none; }

  #scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding-bottom: 4vh;
  }

  /* 字标：谢幕时描边点亮 */
  #wordmark {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 20px;
    user-select: none;
    transition: color 0.3s ease, text-shadow 0.3s ease;
  }
  #stage.out #wordmark {
    color: rgba(190, 232, 255, 0.95);
    text-shadow: 0 0 18px rgba(139, 232, 255, 0.55);
  }

  /* ---- 候场区：HUD 环 + 鲸鱼 ---- */
  #rig {
    position: relative;
    width: 380px; height: 380px;
    flex: none;
    /* 入场：上浮 + 去模糊 + 放大（约 1s） */
    opacity: 0;
    animation: rigIn 1s cubic-bezier(.22, .68, .32, 1) 0.05s forwards;
  }
  @keyframes rigIn {
    from { transform: translateY(26vh) scale(0.72); filter: blur(14px); opacity: 0; }
    to   { transform: translateY(0) scale(1); filter: blur(0); opacity: 1; }
  }

  /* 鲸鱼背后的遥测辉光 */
  #glow {
    position: absolute;
    left: 50%; top: 50%;
    width: 300px; height: 300px;
    margin: -150px 0 0 -150px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(120, 200, 255, 0.22) 0%,
      rgba(90, 160, 255, 0.09) 42%,
      transparent 68%);
    animation: glowPulse 3.4s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(0.94); opacity: 0.75; }
    50%      { transform: scale(1.08); opacity: 1; }
  }

  /* HUD 环组：外圈虚线 / 刻度环 / 反向弧 / 内细环 + 四角括角 */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud .spin-a { animation: spinA 16s linear infinite; transform-origin: 190px 190px; }
  #hud .spin-b { animation: spinB 9s linear infinite reverse; transform-origin: 190px 190px; }
  @keyframes spinA { to { transform: rotate(360deg); } }
  @keyframes spinB { to { transform: rotate(360deg); } }
  /* 雷达扫描楔形 */
  #radar {
    position: absolute;
    left: 50%; top: 50%;
    width: 340px; height: 340px;
    margin: -170px 0 0 -170px;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      rgba(139, 232, 255, 0.2) 0deg,
      rgba(139, 232, 255, 0.05) 30deg,
      transparent 70deg,
      transparent 360deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, #000 58%, transparent 70%);
            mask-image: radial-gradient(circle, #000 0%, #000 58%, transparent 70%);
    animation: radarSpin 2.8s linear infinite;
  }
  @keyframes radarSpin { to { transform: rotate(360deg); } }
  /* 声呐 ping */
  .sonar {
    position: absolute;
    left: 50%; top: 50%;
    width: 240px; height: 240px;
    margin: -120px 0 0 -120px;
    border: 1px solid rgba(139, 232, 255, 0.45);
    border-radius: 50%;
    opacity: 0;
    animation: sonarPing 2.8s ease-out infinite;
  }
  .sonar.s2 { animation-delay: 1.4s; }
  @keyframes sonarPing {
    0% { transform: scale(0.78); opacity: 0; }
    16% { opacity: 0.5; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* 鲸鱼本体（38vh 占场） */
  #fish-rig {
    position: absolute;
    left: 50%; top: 50%;
    width: 38vh; height: 38vh;
    margin: -19vh 0 0 -19vh;
    animation: rigIdle 5.4s ease-in-out infinite;
  }
  @keyframes rigIdle {
    0%   { transform: translateY(0) rotate(0deg) scale(1); }
    16%  { transform: translateY(-6px) rotate(-1.2deg) scale(1.008); }
    30%  { transform: translateY(-6px) rotate(1.2deg) scale(1.008); }
    44%  { transform: translateY(-6px) rotate(0deg) scale(1.008); }
    56%  { transform: translateY(0) rotate(0deg) scale(1); }
    66%  { transform: translateY(0) rotate(-2.4deg) scale(1); }
    70%  { transform: translateY(-11px) rotate(2.4deg) scale(1.022); }
    74%  { transform: translateY(0) rotate(2.4deg) scale(1.022); }
    80%  { transform: translateY(-11px) rotate(0deg) scale(1.022); }
    84%  { transform: translateY(0) rotate(0deg) scale(1.022); }
    100% { transform: translateY(0) rotate(0deg) scale(1); }
  }
  #fish {
    width: 100%; height: 100%;
    border-radius: 50%;
    filter: drop-shadow(0 18px 42px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 26px rgba(120, 190, 255, 0.28));
    user-select: none; pointer-events: none;
  }
  /* 实体化：阶段切换时扫描线掠过 + RGB 分离闪烁 */
  #scanline {
    position: absolute;
    left: 6%; right: 6%;
    top: 0;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, rgba(190, 240, 255, 0.95) 50%, transparent);
    box-shadow: 0 0 16px 4px rgba(139, 232, 255, 0.5);
    opacity: 0;
    z-index: 4;
    pointer-events: none;
  }
  #fish-rig.materialize #scanline { animation: scanSweep 0.5s ease-in-out 1; }
  @keyframes scanSweep {
    0% { top: 4%; opacity: 0; }
    12% { opacity: 1; }
    88% { opacity: 1; }
    100% { top: 96%; opacity: 0; }
  }
  #fish-rig.materialize #fish { animation: rgbSplit 0.42s linear 1; }
  @keyframes rgbSplit {
    0%, 100% { filter: drop-shadow(0 18px 42px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 26px rgba(120, 190, 255, 0.28)); }
    20% { filter: drop-shadow(4px 0 rgba(0, 255, 238, 0.9)) drop-shadow(-4px 0 rgba(255, 0, 200, 0.9)) drop-shadow(0 18px 42px rgba(0, 0, 0, 0.6)); }
    55% { filter: drop-shadow(2px 0 rgba(0, 255, 238, 0.55)) drop-shadow(-2px 0 rgba(255, 0, 200, 0.55)) drop-shadow(0 18px 42px rgba(0, 0, 0, 0.6)); }
  }

  /* ---- 终端读数行（打字机 + 光标）---- */
  #terminal {
    margin-top: 18px;
    width: 420px;
    max-width: 82vw;
    font-family: "Cascadia Mono", "Consolas", "SF Mono", monospace;
    font-size: 13px;
    line-height: 1.4;
    color: rgba(190, 232, 255, 0.92);
    text-shadow: 0 0 12px rgba(139, 232, 255, 0.35);
    white-space: nowrap; overflow: hidden;
    flex: none;
  }
  #terminal .prompt { color: rgba(139, 232, 255, 0.65); margin-right: 8px; }
  #ttext { display: inline; }
  #caret {
    display: inline-block;
    width: 8px; height: 15px;
    margin-left: 3px;
    vertical-align: -2px;
    background: rgba(190, 232, 255, 0.9);
    animation: caretBlink 1s steps(1) infinite;
  }
  @keyframes caretBlink { 50% { opacity: 0; } }
  #terminal.glitch { animation: termGlitch 0.3s steps(2) 2; }
  @keyframes termGlitch {
    0% { transform: translateX(0); }
    25% { transform: translateX(-3px); text-shadow: 2px 0 rgba(255, 0, 200, .8), -2px 0 rgba(0, 255, 238, .8); }
    75% { transform: translateX(3px); text-shadow: -2px 0 rgba(255, 0, 200, .8), 2px 0 rgba(0, 255, 238, .8); }
    100% { transform: translateX(0); }
  }

  /* ---- HUD 自检清单 ---- */
  #checklist {
    margin-top: 20px;
    width: 320px;
    display: flex; flex-direction: column; gap: 6px;
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 12px;
    letter-spacing: 0.4px;
    flex: none;
  }
  .ck-row {
    display: flex; align-items: center; gap: 8px;
    color: rgba(255, 255, 255, 0.3);
    transition: color 0.25s ease;
  }
  .ck-row .mark { color: rgba(139, 232, 255, 0.85); width: 12px; flex: none; }
  .ck-row .tag { margin-left: auto; color: rgba(255, 255, 255, 0.25); }
  .ck-row.done { color: rgba(255, 255, 255, 0.52); }
  .ck-row.done .tag { color: rgba(139, 232, 255, 0.7); }
  .ck-row.active { color: rgba(228, 244, 255, 0.95); }
  .ck-row.active .tag { color: rgba(190, 232, 255, 0.95); }
  .ck-row.just-done { animation: ckPop 0.36s cubic-bezier(.34, 1.56, .64, 1) 1; }
  @keyframes ckPop {
    0% { transform: translateX(-4px); }
    60% { transform: translateX(2px); }
    100% { transform: translateX(0); }
  }

  /* ---- 底部：进度条 + 耗时/版本 ---- */
  #hudbar { margin-top: 20px; width: 100%; flex: none; text-align: center; }
  #progress {
    position: relative;
    width: 240px; height: 2px;
    margin: 0 auto;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  #progress::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 36%;
    background: linear-gradient(90deg, transparent, rgba(139, 232, 255, 0.85), transparent);
    animation: slide 1.2s cubic-bezier(.45, .05, .55, .95) infinite;
  }
  @keyframes slide {
    from { transform: translateX(-110%); }
    to   { transform: translateX(380%); }
  }
  #metaline {
    margin-top: 12px;
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.4px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #metaline .sep { margin: 0 8px; color: rgba(255, 255, 255, 0.16); }
  #elapsed { color: rgba(255, 255, 255, 0.22); }

  /* gif 挂件：右下角，同主题挂件位（right 14 / bottom 12 / 圆角 14） */
  #mascot {
    position: fixed; right: 14px; bottom: 12px;
    width: 110px; height: auto;
    border-radius: 14px;
    object-fit: cover;
    opacity: 0.92;
    filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.5));
    pointer-events: none; user-select: none;
    z-index: 10;
  }

  /* ---- 谢幕要素 ---- */
  /* 冲击波环（拍走时从鲸鱼展开） */
  #shock {
    position: absolute;
    left: 50%; top: 50%;
    width: 38vh; height: 38vh;
    margin: -19vh 0 0 -19vh;
    border: 3px solid rgba(190, 240, 255, 0.9);
    border-radius: 50%;
    opacity: 0;
    z-index: 4;
    pointer-events: none;
  }
  #rays {
    position: absolute;
    left: 50%; top: 50%;
    width: 560px; height: 560px;
    margin: -280px 0 0 -280px;
    border-radius: 50%;
    background: repeating-conic-gradient(
      rgba(255, 255, 255, 0.08) 0deg 5deg,
      transparent 5deg 11deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 66%);
            mask-image: radial-gradient(circle, #000 0%, transparent 66%);
    opacity: 0;
    z-index: 5;
    pointer-events: none;
  }
  #cheer {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0.2) rotate(-8deg);
    font-size: 68px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #ffffff;
    -webkit-text-stroke: 3.5px #0b0f16;
    paint-order: stroke fill;
    text-shadow: 0 8px 34px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 232, 255, 0.45);
    opacity: 0;
    z-index: 6;
    pointer-events: none;
    white-space: nowrap;
  }
  /* 白闪 */
  #flash {
    position: absolute; inset: 0;
    background: #eaf6ff;
    opacity: 0;
    z-index: 8;
    pointer-events: none;
  }

  /* ============ 谢幕编排（.out 由 __splashOut 触发）============ */
  #stage.out #fish-rig { animation: windup 0.15s ease-in forwards; }
  @keyframes windup {
    to { transform: translateY(-14px) rotate(-9deg) scale(1.04); }
  }
  #stage.out #fish { animation: slapFish 0.2s cubic-bezier(.2, .9, .3, 1) forwards 0.15s; }
  @keyframes slapFish {
    0% { transform: scale(1, 1); }
    40% { transform: rotate(11deg) scale(1.1, 0.9); }
    100% { transform: rotate(4deg) scale(1.02, 0.98); }
  }
  /* 终端故障 + 冲击波 */
  #stage.out #terminal { animation: termGlitch 0.3s steps(2) 3 0.15s, fadeOut 0.2s ease forwards 0.5s; }
  #stage.out #shock { animation: shockWave 0.55s cubic-bezier(.2, .7, .3, 1) forwards 0.16s; }
  @keyframes shockWave {
    0% { transform: scale(0.85); opacity: 0.95; border-width: 4px; }
    100% { transform: scale(2.6); opacity: 0; border-width: 1px; }
  }
  /* 放大 + 放射线 + 欢呼 */
  #stage.out #rig { animation: zoomRig 0.32s cubic-bezier(.34, 1.4, .64, 1) forwards 0.34s; }
  @keyframes zoomRig { to { transform: scale(2.05); } }
  #stage.out #rays { animation: raysIn 0.5s ease-out forwards 0.34s; }
  @keyframes raysIn {
    0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
    30% { opacity: 0.95; }
    100% { transform: rotate(24deg) scale(1.05); opacity: 0.6; }
  }
  #stage.out #cheer { animation: cheerIn 0.46s cubic-bezier(.34, 1.56, .64, 1) forwards 0.37s; }
  @keyframes cheerIn {
    0% { transform: translate(-50%, -50%) scale(0.2) rotate(-8deg); opacity: 0; }
    60% { transform: translate(-50%, -50%) scale(1.12) rotate(2deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) rotate(-1.5deg); opacity: 1; }
  }
  /* 白闪 + 其余元素退场 */
  #stage.out #flash { animation: flashIn 0.5s ease-out forwards 0.62s; }
  @keyframes flashIn {
    0% { opacity: 0; }
    18% { opacity: 0.85; }
    100% { opacity: 0; }
  }
  #stage.out #checklist, #stage.out #hudbar, #stage.out #radar,
  #stage.out .sonar, #stage.out #glow, #stage.out #hud { animation: fadeOut 0.2s ease forwards 0.15s; }
  @keyframes fadeOut { to { opacity: 0; } }

  /* 减少动态偏好：静态候场（不上浮、不粒子、不扫描），谢幕只做整页淡出 */
  @media (prefers-reduced-motion: reduce) {
    #bg, .shaft, #glow, #radar, .sonar, #fish-rig, #progress::after, #caret { animation: none !important; }
    #rig { opacity: 1; animation: none !important; }
    #fx { display: none; }
    #stage.out #fish-rig, #stage.out #fish, #stage.out #rig, #stage.out #rays,
    #stage.out #cheer, #stage.out #shock, #stage.out #flash, #stage.out #terminal,
    #stage.out #checklist, #stage.out #hudbar, #stage.out #radar, #stage.out .sonar,
    #stage.out #glow, #stage.out #hud, #stage.out #wordmark { animation: none !important; transition: none !important; }
    #cheer { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="bg"></div>
    <div id="scrim"></div>
    <div class="shaft s1"></div>
    <div class="shaft s2"></div>
    <canvas id="fx"></canvas>

    <div id="scene">
      <div id="wordmark">DeepSeek Harness</div>
      <div id="rig">
        <div id="glow"></div>
        <div id="radar"></div>
        <span class="sonar"></span>
        <span class="sonar s2"></span>
        <svg id="hud" viewBox="0 0 380 380" fill="none">
          <g class="spin-a">
            <circle cx="190" cy="190" r="176" stroke="rgba(139,232,255,0.34)"
              stroke-width="1.5" stroke-dasharray="4 14" stroke-linecap="round" />
            <circle cx="190" cy="190" r="158" stroke="rgba(139,232,255,0.16)"
              stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round" />
          </g>
          <g class="spin-b">
            <circle cx="190" cy="190" r="166" stroke="rgba(139,232,255,0.5)"
              stroke-width="2" stroke-dasharray="46 700" stroke-linecap="round" />
          </g>
          <circle cx="190" cy="190" r="148" stroke="rgba(139,232,255,0.12)" stroke-width="1" />
          <!-- 四角括角 -->
          <path d="M18 46 L18 18 L46 18" stroke="rgba(139,232,255,0.6)" stroke-width="2" stroke-linecap="round" />
          <path d="M334 18 L362 18 L362 46" stroke="rgba(139,232,255,0.6)" stroke-width="2" stroke-linecap="round" />
          <path d="M362 334 L362 362 L334 362" stroke="rgba(139,232,255,0.6)" stroke-width="2" stroke-linecap="round" />
          <path d="M46 362 L18 362 L18 334" stroke="rgba(139,232,255,0.6)" stroke-width="2" stroke-linecap="round" />
        </svg>
        <div id="fish-rig">
          <div id="scanline"></div>
          <img id="fish" src="../assets/icon_app.png" alt="" draggable="false" />
        </div>
        <div id="shock"></div>
        <div id="rays"></div>
        <div id="cheer">开工！</div>
      </div>
      <div id="terminal"><span class="prompt">&gt;</span><span id="ttext">正在启动服务 …</span><span id="caret"></span></div>
      <div id="checklist">
        <div class="ck-row"><span class="mark">▸</span><span>定位 dsh CLI</span><span class="tag">[ -- ]</span></div>
        <div class="ck-row"><span class="mark">▸</span><span>启动服务</span><span class="tag">[ -- ]</span></div>
        <div class="ck-row"><span class="mark">▸</span><span>等待服务就绪</span><span class="tag">[ -- ]</span></div>
        <div class="ck-row"><span class="mark">▸</span><span>进入界面</span><span class="tag">[ -- ]</span></div>
      </div>
      <div id="hudbar">
        <div id="progress"></div>
        <div id="metaline">
          <span id="elapsed">0.0 s</span><span class="sep" id="versep" hidden>·</span><span id="ver" hidden></span>
        </div>
      </div>
    </div>

    <div id="flash"></div>
    <img id="mascot" alt="" draggable="false" hidden />
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const gif = params.get('gif');
  if (gif) {
    const mascot = document.getElementById('mascot');
    mascot.src = 'file://' + gif.replace(/\\/g, '/');
    mascot.hidden = false;
  }
  const ver = params.get('ver');
  if (ver) {
    document.getElementById('ver').textContent = 'v' + ver;
    document.getElementById('ver').hidden = false;
    document.getElementById('versep').hidden = false;
  }

  /* ---- 阶段 → HUD 自检清单 ----
     main.js 的 splashStatus 按序推进：定位 → 启动服务 → 等待服务就绪 → 进入界面。
     match 是文本匹配优先级、row 是清单行号，两者必须分开：
     「进入界面」要先于「等待服务就绪」匹配，否则「服务就绪，正在进入界面 …」
     会被等待态吞掉、勾号停错行。 */
  const PHASES = [
    { match: '定位', row: 0 },
    { match: '启动服务', row: 1 },
    { match: '进入界面', row: 3 },
    { match: '等待服务就绪', row: 2 },
  ];
  const ckRows = Array.from(document.querySelectorAll('.ck-row'));
  let currentPhase = -1;

  function renderChecklist(row) {
    if (row === currentPhase) return;
    const prev = currentPhase;
    currentPhase = row;
    ckRows.forEach(function (r, i) {
      r.classList.remove('just-done');
      if (row < 0) return;
      if (i < row) {
        r.classList.add('done');
        r.classList.remove('active');
        r.querySelector('.tag').textContent = '[ OK ]';
      } else if (i === row) {
        r.classList.add('active');
        r.classList.remove('done');
        r.querySelector('.tag').textContent = '[ .. ]';
      } else {
        r.classList.remove('done', 'active');
        r.querySelector('.tag').textContent = '[ -- ]';
      }
    });
    if (prev >= 0 && prev < row && ckRows[prev]) {
      const r = ckRows[prev];
      r.classList.add('done');
      void r.offsetWidth;
      r.classList.add('just-done');
    }
  }

  /* ---- 终端打字机 ---- */
  const ttextEl = document.getElementById('ttext');
  const terminalEl = document.getElementById('terminal');
  let typeTimer = null;
  function typeText(text) {
    clearInterval(typeTimer);
    ttextEl.textContent = '';
    let i = 0;
    typeTimer = setInterval(function () {
      i++;
      ttextEl.textContent = text.slice(0, i);
      if (i >= text.length) clearInterval(typeTimer);
    }, 26);
  }

  /* ---- 实体化：扫描线掠过 + RGB 分离 + 终端故障 ---- */
  const fishRig = document.getElementById('fish-rig');
  let matTimer = null;
  function materialize() {
    fishRig.classList.remove('materialize');
    void fishRig.offsetWidth;
    fishRig.classList.add('materialize');
    clearTimeout(matTimer);
    matTimer = setTimeout(function () { fishRig.classList.remove('materialize'); }, 900);
    terminalEl.classList.remove('glitch');
    void terminalEl.offsetWidth;
    terminalEl.classList.add('glitch');
    setTimeout(function () { terminalEl.classList.remove('glitch'); }, 900);
  }

  window.__setStatus = function (text) {
    if (ttextEl.textContent === text && typeTimer) return;
    typeText(text);
    let row = -1;
    for (let i = 0; i < PHASES.length; i++) {
      if (text.indexOf(PHASES[i].match) !== -1) { row = PHASES[i].row; break; }
    }
    if (row >= 0) {
      renderChecklist(row);
      materialize();
    }
  };

  /* ---- 粒子场（气泡 + 浮游光尘）---- */
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let parts = [];
  let fxRaf = null;
  function fxResize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(innerWidth * innerHeight / 16000);
    parts = Array.from({ length: Math.max(40, Math.min(110, n)) }, function () {
      return {
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 2.4 + 0.5,
        vy: -(Math.random() * 0.32 + 0.1),
        vx: (Math.random() - 0.5) * 0.14,
        a: Math.random() * 0.45 + 0.12,
        tw: Math.random() * Math.PI * 2,
        bright: Math.random() < 0.16,
      };
    });
  }
  function fxTick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.x += p.vx;
      p.y += p.vy;
      p.tw += 0.028;
      if (p.y < -8) { p.y = innerHeight + 8; p.x = Math.random() * innerWidth; }
      if (p.x < -8) p.x = innerWidth + 8;
      if (p.x > innerWidth + 8) p.x = -8;
      const a = p.a * (0.55 + 0.45 * Math.sin(p.tw));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = p.bright
        ? 'rgba(220, 245, 255,' + a.toFixed(3) + ')'
        : 'rgba(150, 205, 250,' + (a * 0.7).toFixed(3) + ')';
      ctx.fill();
    }
    fxRaf = requestAnimationFrame(fxTick);
  }
  if (!reduceMotion) {
    fxResize();
    fxTick();
    window.addEventListener('resize', fxResize);
  }

  // 启动耗时计时（0.1s 步进）
  const elapsedEl = document.getElementById('elapsed');
  let t0 = Date.now();
  let timer = null;
  const startTimer = function () {
    clearInterval(timer);
    t0 = Date.now();
    timer = setInterval(function () {
      elapsedEl.textContent = ((Date.now() - t0) / 1000).toFixed(1) + ' s';
    }, 100);
  };
  startTimer();

  // 主进程在服务就绪、即将加载界面时调用：播放谢幕编排（蓄力→拍走→放大欢呼→白闪）
  // 约 1.1s 后整页淡出。时序与 main.js 的 withTimeout(splashOut(), 1200) 串行等待
  // 配套：1.1s 已贴近上限，不得再加长
  window.__splashOut = function () {
    return new Promise(function (resolve) {
      clearInterval(timer);
      clearInterval(typeTimer);
      if (fxRaf) cancelAnimationFrame(fxRaf);
      const stage = document.getElementById('stage');
      stage.classList.remove('out');
      void stage.offsetWidth;
      stage.classList.add('out');
      setTimeout(function () {
        stage.classList.add('leaving');
        setTimeout(resolve, 220);
      }, 880);
    });
  };

  // 淡出后需要回退重试（预热服务失联转自启动）时，恢复候场并重置计时
  window.__splashIn = function () {
    const stage = document.getElementById('stage');
    stage.classList.remove('out', 'leaving');
    startTimer();
  };
</script>
</body>
</html>
