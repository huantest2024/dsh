<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>DeepSeek Harness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #05070d;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    /* 本页严禁任何 -webkit-app-region：整页级 drag 区域会并进窗口判定区域且
       不随后续导航回收，毒化顶栏按钮的点击（bar.html 顶栏同款教训，弃用该机制） */
  }
  #stage { position: fixed; inset: 0; }
  #stage.leaving { animation: stageOut 0.22s ease forwards; }
  @keyframes stageOut { to { opacity: 0; } }

  /* ============ 加载中间态 = 皮肤「鲸鱼娘 · 未至之境」============
     片头直接沿用该皮肤的视觉本体（背景视频 whale-fantasy-loop.mp4，
     CC BY-NC-SA 4.0 © stushansusu，见 assets/whale-fantasy-loop.LICENSE.txt），
     叠加皮肤同款的玻璃仪表盘（终端打字机 + 自检清单），
     使片头与片尾工作区（同一皮肤）视觉连续。
     全响应式：一切尺寸走 clamp()/vh/vw，任意窗口尺寸不裁切、不溢出。
     层级：夜底+环境辉光（兜底）→ 数据雨 canvas（兜底）→ 皮肤视频 →
           压暗 scrim → 品牌锁定 → 玻璃仪表盘 → 进度/耗时 → 挂件。 */

  /* ---- 兜底层：夜底 + 双色环境辉光（视频不可用时的退路）---- */
  #ambient {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 80% at 82% 12%, rgba(57, 255, 209, 0.07) 0%, transparent 62%),
      radial-gradient(95% 70% at 8% 92%, rgba(58, 123, 255, 0.08) 0%, transparent 64%),
      #05070d;
  }
  #fx { position: absolute; inset: 0; pointer-events: none; }

  /* ---- 皮肤视频背景（主角）---- */
  #bgvid {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 42%;
    pointer-events: none;
  }
  /* 压暗：整体轻罩 + 底部加重（保仪表盘可读），角色保持清晰 */
  #scrim {
    position: absolute; inset: 0;
    background:
      radial-gradient(78% 66% at 50% 34%, rgba(5, 7, 13, 0.18) 0%, rgba(5, 7, 13, 0.52) 100%),
      linear-gradient(180deg, rgba(5, 7, 13, 0.5) 0%, transparent 20%, transparent 46%, rgba(5, 7, 13, 0.78) 100%);
  }

  #scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center;
    padding: clamp(14px, 3vh, 30px) clamp(12px, 3vw, 32px);
    overflow: hidden;
  }

  /* ---- 品牌锁定：小徽章 + 字标 ---- */
  #brand {
    display: flex; flex-direction: column;
    align-items: center;
    gap: clamp(6px, 1.2vh, 12px);
    flex: none;
  }
  #badge {
    width: clamp(52px, 8.5vh, 96px);
    height: clamp(52px, 8.5vh, 96px);
    border-radius: 50%;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 16px rgba(58, 123, 255, 0.35));
    user-select: none; pointer-events: none;
  }
  #wordmark {
    font-size: clamp(10px, 1.5vh, 13px);
    font-weight: 600;
    letter-spacing: clamp(2px, 0.5vw, 5px);
    text-transform: uppercase;
    color: rgba(232, 241, 255, 0.62);
    user-select: none;
    white-space: nowrap;
    transition: color 0.3s ease, text-shadow 0.3s ease;
  }
  #stage.out #wordmark {
    color: rgba(232, 241, 255, 0.95);
    text-shadow: 0 0 18px rgba(58, 123, 255, 0.75);
  }

  /* ---- 玻璃仪表盘：终端 + 自检清单（皮肤同款 pane）---- */
  #console {
    margin-top: clamp(20px, 11vh, 110px);
    width: min(520px, 88vw);
    padding: clamp(10px, 1.8vh, 15px) clamp(14px, 2.4vw, 20px) clamp(11px, 2vh, 16px);
    border-radius: 12px;
    border: 1px solid rgba(30, 58, 107, 0.73);
    background:
      radial-gradient(120% 80% at 82% 12%, rgba(57, 255, 209, 0.07) 0%, transparent 62%),
      radial-gradient(95% 70% at 8% 92%, rgba(58, 123, 255, 0.08) 0%, transparent 64%),
      rgba(10, 16, 32, 0.74);
    box-shadow: 0 0 24px rgba(58, 123, 255, 0.14), inset 0 1px 0 rgba(57, 255, 209, 0.28);
    backdrop-filter: blur(8px);
    flex: none;
  }
  /* 终端读数行（打字机 + 光标） */
  #terminal {
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: clamp(11px, 1.55vh, 13px);
    line-height: 1.4;
    color: #E8F1FF;
    white-space: nowrap; overflow: hidden;
  }
  #terminal .prompt { color: #3A7BFF; margin-right: 8px; font-weight: 700; }
  #caret {
    display: inline-block;
    width: 0.55em; height: 1em;
    margin-left: 3px;
    vertical-align: -0.15em;
    background: #39FFD1;
    animation: caretBlink 1s steps(1) infinite;
  }
  @keyframes caretBlink { 50% { opacity: 0; } }
  #terminal.glitch { animation: termGlitch 0.3s steps(2) 2; }
  @keyframes termGlitch {
    0% { transform: translateX(0); }
    25% { transform: translateX(-3px); text-shadow: 2px 0 rgba(57, 255, 209, .8), -2px 0 rgba(58, 123, 255, .8); }
    75% { transform: translateX(3px); text-shadow: -2px 0 rgba(57, 255, 209, .8), 2px 0 rgba(58, 123, 255, .8); }
    100% { transform: translateX(0); }
  }
  /* 自检清单 */
  #checklist {
    margin-top: clamp(7px, 1.3vh, 11px);
    display: flex; flex-direction: column;
    gap: clamp(3px, 0.6vh, 5px);
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: clamp(10px, 1.4vh, 12px);
    letter-spacing: 0.3px;
  }
  .ck-row {
    display: flex; align-items: center; gap: 8px;
    color: rgba(143, 168, 204, 0.55);
    transition: color 0.25s ease;
  }
  .ck-row .mark { color: rgba(58, 123, 255, 0.8); width: 12px; flex: none; }
  .ck-row .tag { margin-left: auto; color: rgba(143, 168, 204, 0.45); }
  .ck-row.done { color: rgba(232, 241, 255, 0.72); }
  .ck-row.done .tag { color: rgba(57, 255, 209, 0.75); }
  .ck-row.active { color: #E8F1FF; }
  .ck-row.active .tag { color: #39FFD1; text-shadow: 0 0 10px rgba(57, 255, 209, 0.45); }
  .ck-row.just-done { animation: ckPop 0.36s cubic-bezier(.34, 1.56, .64, 1) 1; }
  @keyframes ckPop {
    0% { transform: translateX(-4px); }
    60% { transform: translateX(2px); }
    100% { transform: translateX(0); }
  }

  /* ---- 底部：进度条 + 耗时/版本（吸底随高度自适应）---- */
  #hudbar {
    margin-top: auto;
    padding-top: clamp(10px, 2vh, 18px);
    width: 100%;
    flex: none;
    text-align: center;
  }
  #progress {
    position: relative;
    width: min(240px, 60vw);
    height: 2px;
    margin: 0 auto;
    border-radius: 2px;
    background: rgba(30, 58, 107, 0.55);
    overflow: hidden;
  }
  #progress::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 36%;
    background: linear-gradient(90deg, transparent, #3A7BFF, transparent);
    animation: slide 1.2s cubic-bezier(.45, .05, .55, .95) infinite;
  }
  @keyframes slide {
    from { transform: translateX(-110%); }
    to   { transform: translateX(380%); }
  }
  #metaline {
    margin-top: clamp(8px, 1.4vh, 12px);
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: clamp(10px, 1.35vh, 11.5px);
    color: rgba(143, 168, 204, 0.6);
    letter-spacing: 0.4px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #metaline .sep { margin: 0 8px; color: rgba(30, 58, 107, 0.9); }
  #elapsed { color: rgba(143, 168, 204, 0.4); }

  /* gif 挂件：右下角，同主题挂件位 */
  #mascot {
    position: fixed;
    right: clamp(8px, 1.2vw, 14px);
    bottom: clamp(8px, 1.2vw, 12px);
    width: clamp(72px, 12vh, 110px);
    height: auto;
    border-radius: 14px;
    object-fit: cover;
    opacity: 0.92;
    filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.5));
    pointer-events: none; user-select: none;
    z-index: 10;
  }

  /* ---- 谢幕要素：冲击波 + 放射线 + 开工！---- */
  #shock {
    position: absolute;
    left: 50%; top: 62%;
    width: min(520px, 88vw); height: min(520px, 88vw);
    margin-left: min(-260px, -44vw);
    margin-top: min(-260px, -44vw);
    border: 3px solid rgba(57, 255, 209, 0.9);
    border-radius: 50%;
    opacity: 0;
    z-index: 4;
    pointer-events: none;
  }
  #rays {
    position: absolute;
    left: 50%; top: 50%;
    width: min(620px, 96vw); height: min(620px, 96vw);
    margin-left: min(-310px, -48vw);
    margin-top: min(-310px, -48vw);
    border-radius: 50%;
    background: repeating-conic-gradient(
      rgba(58, 123, 255, 0.1) 0deg 5deg,
      transparent 5deg 11deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 66%);
            mask-image: radial-gradient(circle, #000 0%, transparent 66%);
    opacity: 0;
    z-index: 5;
    pointer-events: none;
  }
  #cheer {
    position: absolute;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%) scale(0.2) rotate(-8deg);
    font-size: clamp(40px, 8.5vh, 68px);
    font-weight: 900;
    letter-spacing: clamp(2px, 0.8vw, 5px);
    color: #ffffff;
    -webkit-text-stroke: 3px #05070d;
    paint-order: stroke fill;
    text-shadow: 0 8px 34px rgba(0, 0, 0, 0.6), 0 0 34px rgba(58, 123, 255, 0.6);
    opacity: 0;
    z-index: 6;
    pointer-events: none;
    white-space: nowrap;
  }
  #flash {
    position: absolute; inset: 0;
    background: #eaf6ff;
    opacity: 0;
    z-index: 8;
    pointer-events: none;
  }

  /* ============ 谢幕编排（.out 由 __splashOut 触发）============
     ① 仪表盘锁定：边框转青 + 轻震（0~150ms）
     ② 冲击波：从仪表盘中心展开（160ms 起）
     ③ 放大欢呼：放射线 + 「开工！」弹入（340ms 起）
     ④ 白闪 → 整页淡出（620ms 起，总 ~1.1s，main.js 超时上限 1200ms） */
  #stage.out #console {
    animation: consoleLock 0.5s ease-out forwards;
    border-color: rgba(57, 255, 209, 0.85);
    box-shadow: 0 0 34px rgba(57, 255, 209, 0.35), inset 0 1px 0 rgba(57, 255, 209, 0.6);
  }
  @keyframes consoleLock {
    0% { transform: scale(1); }
    35% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  #stage.out #shock { animation: shockWave 0.55s cubic-bezier(.2, .7, .3, 1) forwards 0.16s; }
  @keyframes shockWave {
    0% { transform: scale(0.85); opacity: 0.95; border-width: 4px; }
    100% { transform: scale(2.4); opacity: 0; border-width: 1px; }
  }
  #stage.out #rays { animation: raysIn 0.5s ease-out forwards 0.34s; }
  @keyframes raysIn {
    0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
    30% { opacity: 0.95; }
    100% { transform: rotate(24deg) scale(1.05); opacity: 0.6; }
  }
  #stage.out #cheer { animation: cheerIn 0.46s cubic-bezier(.34, 1.56, .64, 1) forwards 0.37s; }
  @keyframes cheerIn {
    0% { transform: translate(-50%, -50%) scale(0.2) rotate(-8deg); opacity: 0; }
    60% { transform: translate(-50%, -50%) scale(1.12) rotate(2deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) rotate(-1.5deg); opacity: 1; }
  }
  #stage.out #flash { animation: flashIn 0.5s ease-out forwards 0.62s; }
  @keyframes flashIn {
    0% { opacity: 0; }
    18% { opacity: 0.85; }
    100% { opacity: 0; }
  }
  #stage.out #hudbar { animation: fadeOut 0.2s ease forwards 0.15s; }
  @keyframes fadeOut { to { opacity: 0; } }

  /* 减少动态偏好：静态候场（无数据雨），谢幕只做整页淡出 */
  @media (prefers-reduced-motion: reduce) {
    #caret, #progress::after { animation: none !important; }
    #fx { display: none; }
    #stage.out #console, #stage.out #shock, #stage.out #rays, #stage.out #cheer,
    #stage.out #flash, #stage.out #hudbar, #stage.out #wordmark { animation: none !important; transition: none !important; }
    #cheer { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="ambient"></div>
    <canvas id="fx"></canvas>
    <video id="bgvid" src="../assets/whale-fantasy-loop.mp4" autoplay muted loop playsinline preload="auto"></video>
    <div id="scrim"></div>

    <div id="scene">
      <div id="brand">
        <img id="badge" src="../assets/icon_app.png" alt="" draggable="false" />
        <div id="wordmark">DeepSeek Harness</div>
      </div>
      <div id="console">
        <div id="terminal"><span class="prompt">&gt;</span><span id="ttext">正在启动服务 …</span><span id="caret"></span></div>
        <div id="checklist">
          <div class="ck-row"><span class="mark">▸</span><span>定位 dsh CLI</span><span class="tag">[ -- ]</span></div>
          <div class="ck-row"><span class="mark">▸</span><span>启动服务</span><span class="tag">[ -- ]</span></div>
          <div class="ck-row"><span class="mark">▸</span><span>等待服务就绪</span><span class="tag">[ -- ]</span></div>
          <div class="ck-row"><span class="mark">▸</span><span>进入界面</span><span class="tag">[ -- ]</span></div>
        </div>
      </div>
      <div id="hudbar">
        <div id="progress"></div>
        <div id="metaline">
          <span id="elapsed">0.0 s</span><span class="sep" id="versep" hidden>·</span><span id="ver" hidden></span>
        </div>
      </div>
    </div>

    <div id="shock"></div>
    <div id="rays"></div>
    <div id="cheer">开工！</div>
    <div id="flash"></div>
    <img id="mascot" alt="" draggable="false" hidden />
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const gif = params.get('gif');
  if (gif) {
    const mascot = document.getElementById('mascot');
    mascot.src = 'file://' + gif.replace(/\\/g, '/');
    mascot.hidden = false;
  }
  const ver = params.get('ver');
  if (ver) {
    document.getElementById('ver').textContent = 'v' + ver;
    document.getElementById('ver').hidden = false;
    document.getElementById('versep').hidden = false;
  }

  /* ---- 阶段 → HUD 自检清单 ----
     main.js 的 splashStatus 按序推进：定位 → 启动服务 → 等待服务就绪 → 进入界面。
     match 是文本匹配优先级、row 是清单行号，两者必须分开：
     「进入界面」要先于「等待服务就绪」匹配，否则「服务就绪，正在进入界面 …」
     会被等待态吞掉、勾号停错行。 */
  const PHASES = [
    { match: '定位', row: 0 },
    { match: '启动服务', row: 1 },
    { match: '进入界面', row: 3 },
    { match: '等待服务就绪', row: 2 },
  ];
  const ckRows = Array.from(document.querySelectorAll('.ck-row'));
  let currentPhase = -1;

  function renderChecklist(row) {
    if (row === currentPhase) return;
    const prev = currentPhase;
    currentPhase = row;
    ckRows.forEach(function (r, i) {
      r.classList.remove('just-done');
      if (row < 0) return;
      if (i < row) {
        r.classList.add('done');
        r.classList.remove('active');
        r.querySelector('.tag').textContent = '[ OK ]';
      } else if (i === row) {
        r.classList.add('active');
        r.classList.remove('done');
        r.querySelector('.tag').textContent = '[ .. ]';
      } else {
        r.classList.remove('done', 'active');
        r.querySelector('.tag').textContent = '[ -- ]';
      }
    });
    if (prev >= 0 && prev < row && ckRows[prev]) {
      const r = ckRows[prev];
      r.classList.add('done');
      void r.offsetWidth;
      r.classList.add('just-done');
    }
  }

  /* ---- 终端打字机 ---- */
  const ttextEl = document.getElementById('ttext');
  const terminalEl = document.getElementById('terminal');
  let typeTimer = null;
  function typeText(text) {
    clearInterval(typeTimer);
    ttextEl.textContent = '';
    let i = 0;
    typeTimer = setInterval(function () {
      i++;
      ttextEl.textContent = text.slice(0, i);
      if (i >= text.length) clearInterval(typeTimer);
    }, 26);
  }

  /* ---- 实体化：终端故障闪烁 ---- */
  let matTimer = null;
  function materialize() {
    terminalEl.classList.remove('glitch');
    void terminalEl.offsetWidth;
    terminalEl.classList.add('glitch');
    clearTimeout(matTimer);
    matTimer = setTimeout(function () { terminalEl.classList.remove('glitch'); }, 900);
  }

  window.__setStatus = function (text) {
    if (ttextEl.textContent === text && typeTimer) return;
    typeText(text);
    let row = -1;
    for (let i = 0; i < PHASES.length; i++) {
      if (text.indexOf(PHASES[i].match) !== -1) { row = PHASES[i].row; break; }
    }
    if (row >= 0) {
      renderChecklist(row);
      materialize();
    }
  };

  /* ---- 数据雨（兜底：视频不可见时仍有的氛围层）---- */
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let drops = [];
  let fxRaf = null;
  let lastT = 0;
  const RAIN_COLORS = [
    'rgba(30, 58, 107, ',
    'rgba(58, 123, 255, ',
    'rgba(57, 255, 209, ',
  ];
  function newDrop(x, anywhere) {
    const cyan = Math.random() < 0.12;
    return {
      x: x,
      y: anywhere ? Math.random() * innerHeight : -20 - Math.random() * 60,
      len: 10 + Math.random() * 26,
      speed: 60 + Math.random() * 130,
      alpha: 0.1 + Math.random() * 0.35,
      color: cyan ? RAIN_COLORS[2] : (Math.random() < 0.4 ? RAIN_COLORS[1] : RAIN_COLORS[0]),
      head: cyan || Math.random() < 0.25,
    };
  }
  function fxResize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = Math.ceil(innerWidth / 16);
    drops = Array.from({ length: cols }, function (_, i) {
      return newDrop(i * 16 + 4, true);
    });
  }
  function fxTick(t) {
    const dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0.016;
    lastT = t;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      d.y += d.speed * dt;
      if (d.y - d.len > innerHeight) { drops[i] = newDrop(d.x, false); continue; }
      const top = Math.max(0, d.y - d.len);
      const g = ctx.createLinearGradient(d.x, top, d.x, d.y);
      g.addColorStop(0, d.color + '0)');
      g.addColorStop(1, d.color + d.alpha.toFixed(3) + ')');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(d.x, top);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();
      if (d.head) {
        ctx.fillStyle = d.color + Math.min(0.85, d.alpha + 0.4).toFixed(3) + ')';
        ctx.fillRect(d.x - 0.7, d.y - 1.4, 1.4, 2.8);
      }
    }
    fxRaf = requestAnimationFrame(fxTick);
  }
  if (!reduceMotion) {
    fxResize();
    fxTick(0);
    window.addEventListener('resize', fxResize);
  }

  // 启动耗时计时（0.1s 步进）
  const elapsedEl = document.getElementById('elapsed');
  let t0 = Date.now();
  let timer = null;
  const startTimer = function () {
    clearInterval(timer);
    t0 = Date.now();
    timer = setInterval(function () {
      elapsedEl.textContent = ((Date.now() - t0) / 1000).toFixed(1) + ' s';
    }, 100);
  };
  startTimer();

  // 主进程在服务就绪、即将加载界面时调用：谢幕编排（仪表盘锁定 → 冲击波 →
  // 放射线 + 「开工！」→ 白闪 → 淡出），约 1.1s。时序与 main.js 的
  // withTimeout(splashOut(), 1200) 串行等待配套，不得再加长
  window.__splashOut = function () {
    return new Promise(function (resolve) {
      clearInterval(timer);
      clearInterval(typeTimer);
      if (fxRaf) cancelAnimationFrame(fxRaf);
      const v = document.getElementById('bgvid');
      if (v) { try { v.pause(); } catch (e) {} }
      const stage = document.getElementById('stage');
      stage.classList.remove('out');
      void stage.offsetWidth;
      stage.classList.add('out');
      setTimeout(function () {
        stage.classList.add('leaving');
        setTimeout(resolve, 220);
      }, 880);
    });
  };

  // 淡出后需要回退重试（预热服务失联转自启动）时，恢复候场并重置计时
  window.__splashIn = function () {
    const stage = document.getElementById('stage');
    stage.classList.remove('out', 'leaving');
    const v = document.getElementById('bgvid');
    if (v) { try { v.play(); } catch (e) {} }
    startTimer();
  };
</script>
</body>
</html>
