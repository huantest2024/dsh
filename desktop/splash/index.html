<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>DeepSeek Harness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #05070d;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    /* 本页严禁任何 -webkit-app-region：整页级 drag 区域会并进窗口判定区域且
       不随后续导航回收，毒化顶栏按钮的点击（bar.html 顶栏同款教训，弃用该机制） */
  }
  #stage { position: fixed; inset: 0; }
  #stage.leaving { animation: stageOut 0.22s ease forwards; }
  @keyframes stageOut { to { opacity: 0; } }

  /* ============ 小肥鱼深海开场 · 全息仪表盘版 ============
     视觉语言取自社区皮肤「鲸鱼娘 · 未至之境」(whale-fantasy) 的设计约定
     （夜底 #05070D / 层级 #0a1020·#142847 / 1px 冷蓝结构线 #1e3a6b /
      电光蓝 #3A7BFF / 状态青 #39FFD1 / 银白 #E8F1FF / 薄玻璃面板），
     素材与实现均为本项目自有：数据雨、遥测 HUD、玻璃仪表盘、鲸鱼徽章。
     构成：深海夜底 + 双色环境辉光 + canvas 数据雨 + 38vh 鲸鱼徽章（电光蓝
     外辉 + 青色内沿）+ 遥测 HUD 环 + 玻璃仪表盘（终端打字机 + 自检清单）；
     谢幕：蓄力 → 拍走（终端故障 + 青色冲击波）→ 居中放大 + 放射线 +
     「开工！」→ 白闪淡出。 */

  /* ---- 夜底 + 双色环境辉光（皮肤的同款 pane 渐变）---- */
  #ambient {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 80% at 82% 12%, rgba(57, 255, 209, 0.07) 0%, transparent 62%),
      radial-gradient(95% 70% at 8% 92%, rgba(58, 123, 255, 0.08) 0%, transparent 64%),
      #05070d;
  }
  /* 数据雨画布 */
  #fx { position: absolute; inset: 0; pointer-events: none; }

  #scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding-bottom: 2vh;
  }

  /* 字标：谢幕时电光蓝点亮 */
  #wordmark {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(232, 241, 255, 0.5);
    margin-bottom: 12px;
    user-select: none;
    transition: color 0.3s ease, text-shadow 0.3s ease;
  }
  #stage.out #wordmark {
    color: rgba(232, 241, 255, 0.95);
    text-shadow: 0 0 18px rgba(58, 123, 255, 0.75);
  }

  /* ---- 候场区：HUD 环 + 鲸鱼 ---- */
  #rig {
    position: relative;
    width: 56vh; height: 56vh;
    flex: none;
    opacity: 0;
    animation: rigIn 1s cubic-bezier(.22, .68, .32, 1) 0.05s forwards;
  }
  @keyframes rigIn {
    from { transform: translateY(26vh) scale(0.72); filter: blur(14px); opacity: 0; }
    to   { transform: translateY(0) scale(1); filter: blur(0); opacity: 1; }
  }

  /* 鲸鱼身后的电光蓝遥测辉光 */
  #glow {
    position: absolute;
    left: 50%; top: 50%;
    width: 44vh; height: 44vh;
    margin: -22vh 0 0 -22vh;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(58, 123, 255, 0.2) 0%,
      rgba(58, 123, 255, 0.07) 42%,
      transparent 68%);
    animation: glowPulse 3.4s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(0.94); opacity: 0.75; }
    50%      { transform: scale(1.08); opacity: 1; }
  }

  /* HUD 环组：外圈虚线 / 刻度环 / 反向弧 / 内细环 + 四角括角（1px 冷蓝） */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud .spin-a { animation: spinA 16s linear infinite; transform-origin: 280px 280px; }
  #hud .spin-b { animation: spinB 9s linear infinite reverse; transform-origin: 280px 280px; }
  @keyframes spinA { to { transform: rotate(360deg); } }
  @keyframes spinB { to { transform: rotate(360deg); } }
  /* 雷达扫描楔形（青色，极淡） */
  #radar {
    position: absolute;
    left: 50%; top: 50%;
    width: 50vh; height: 50vh;
    margin: -25vh 0 0 -25vh;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      rgba(57, 255, 209, 0.13) 0deg,
      rgba(57, 255, 209, 0.03) 30deg,
      transparent 70deg,
      transparent 360deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, #000 58%, transparent 70%);
            mask-image: radial-gradient(circle, #000 0%, #000 58%, transparent 70%);
    animation: radarSpin 2.8s linear infinite;
  }
  @keyframes radarSpin { to { transform: rotate(360deg); } }
  /* 声呐 ping（电光蓝） */
  .sonar {
    position: absolute;
    left: 50%; top: 50%;
    width: 36vh; height: 36vh;
    margin: -18vh 0 0 -18vh;
    border: 1px solid rgba(58, 123, 255, 0.4);
    border-radius: 50%;
    opacity: 0;
    animation: sonarPing 2.8s ease-out infinite;
  }
  .sonar.s2 { animation-delay: 1.4s; }
  @keyframes sonarPing {
    0% { transform: scale(0.78); opacity: 0; }
    16% { opacity: 0.45; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* 鲸鱼本体（38vh 占场；电光蓝外辉 + 青色内沿是全息皮肤的签名配方） */
  #fish-rig {
    position: absolute;
    left: 50%; top: 50%;
    width: 50vh; height: 50vh;
    margin: -25vh 0 0 -25vh;
    animation: rigIdle 5.4s ease-in-out infinite;
  }
  @keyframes rigIdle {
    0%   { transform: translateY(0) rotate(0deg) scale(1); }
    16%  { transform: translateY(-6px) rotate(-1.2deg) scale(1.008); }
    30%  { transform: translateY(-6px) rotate(1.2deg) scale(1.008); }
    44%  { transform: translateY(-6px) rotate(0deg) scale(1.008); }
    56%  { transform: translateY(0) rotate(0deg) scale(1); }
    66%  { transform: translateY(0) rotate(-2.4deg) scale(1); }
    70%  { transform: translateY(-11px) rotate(2.4deg) scale(1.022); }
    74%  { transform: translateY(0) rotate(2.4deg) scale(1.022); }
    80%  { transform: translateY(-11px) rotate(0deg) scale(1.022); }
    84%  { transform: translateY(0) rotate(0deg) scale(1.022); }
    100% { transform: translateY(0) rotate(0deg) scale(1); }
  }
  #fish {
    width: 100%; height: 100%;
    border-radius: 50%;
    filter:
      drop-shadow(0 18px 42px rgba(0, 0, 0, 0.6))
      drop-shadow(0 0 24px rgba(58, 123, 255, 0.4));
    user-select: none; pointer-events: none;
  }
  /* 实体化：阶段切换时扫描线掠过 + RGB 分离闪烁 */
  #scanline {
    position: absolute;
    left: 6%; right: 6%;
    top: 0;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, rgba(57, 255, 209, 0.95) 50%, transparent);
    box-shadow: 0 0 16px 4px rgba(57, 255, 209, 0.45);
    opacity: 0;
    z-index: 4;
    pointer-events: none;
  }
  #fish-rig.materialize #scanline { animation: scanSweep 0.5s ease-in-out 1; }
  @keyframes scanSweep {
    0% { top: 4%; opacity: 0; }
    12% { opacity: 1; }
    88% { opacity: 1; }
    100% { top: 96%; opacity: 0; }
  }
  #fish-rig.materialize #fish { animation: rgbSplit 0.42s linear 1; }
  @keyframes rgbSplit {
    0%, 100% { filter: drop-shadow(0 18px 42px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 24px rgba(58, 123, 255, 0.4)); }
    20% { filter: drop-shadow(4px 0 rgba(57, 255, 209, 0.9)) drop-shadow(-4px 0 rgba(58, 123, 255, 0.9)) drop-shadow(0 18px 42px rgba(0, 0, 0, 0.6)); }
    55% { filter: drop-shadow(2px 0 rgba(57, 255, 209, 0.55)) drop-shadow(-2px 0 rgba(58, 123, 255, 0.55)) drop-shadow(0 18px 42px rgba(0, 0, 0, 0.6)); }
  }

  /* ---- 玻璃仪表盘：终端 + 自检清单（皮肤同款 pane 渐变 + 1px 冷蓝边 + 青色内沿）---- */
  #console {
    margin-top: 14px;
    width: 460px;
    max-width: 86vw;
    padding: 12px 16px 13px;
    border-radius: 12px;
    border: 1px solid rgba(30, 58, 107, 0.73);
    background:
      radial-gradient(120% 80% at 82% 12%, rgba(57, 255, 209, 0.07) 0%, transparent 62%),
      radial-gradient(95% 70% at 8% 92%, rgba(58, 123, 255, 0.08) 0%, transparent 64%),
      rgba(10, 16, 32, 0.72);
    box-shadow: 0 0 24px rgba(58, 123, 255, 0.14), inset 0 1px 0 rgba(57, 255, 209, 0.28);
    backdrop-filter: blur(8px);
    flex: none;
  }
  /* 终端读数行（打字机 + 光标） */
  #terminal {
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 13px;
    line-height: 1.4;
    color: #E8F1FF;
    white-space: nowrap; overflow: hidden;
  }
  #terminal .prompt { color: #3A7BFF; margin-right: 8px; font-weight: 700; }
  #caret {
    display: inline-block;
    width: 8px; height: 15px;
    margin-left: 3px;
    vertical-align: -2px;
    background: #39FFD1;
    animation: caretBlink 1s steps(1) infinite;
  }
  @keyframes caretBlink { 50% { opacity: 0; } }
  #terminal.glitch { animation: termGlitch 0.3s steps(2) 2; }
  @keyframes termGlitch {
    0% { transform: translateX(0); }
    25% { transform: translateX(-3px); text-shadow: 2px 0 rgba(57, 255, 209, .8), -2px 0 rgba(58, 123, 255, .8); }
    75% { transform: translateX(3px); text-shadow: -2px 0 rgba(57, 255, 209, .8), 2px 0 rgba(58, 123, 255, .8); }
    100% { transform: translateX(0); }
  }
  /* 自检清单 */
  #checklist {
    margin-top: 9px;
    display: flex; flex-direction: column; gap: 4px;
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 12px;
    letter-spacing: 0.4px;
  }
  .ck-row {
    display: flex; align-items: center; gap: 8px;
    color: rgba(143, 168, 204, 0.55);
    transition: color 0.25s ease;
  }
  .ck-row .mark { color: rgba(58, 123, 255, 0.8); width: 12px; flex: none; }
  .ck-row .tag { margin-left: auto; color: rgba(143, 168, 204, 0.45); }
  .ck-row.done { color: rgba(232, 241, 255, 0.72); }
  .ck-row.done .tag { color: rgba(57, 255, 209, 0.75); }
  .ck-row.active { color: #E8F1FF; }
  .ck-row.active .tag { color: #39FFD1; text-shadow: 0 0 10px rgba(57, 255, 209, 0.45); }
  .ck-row.just-done { animation: ckPop 0.36s cubic-bezier(.34, 1.56, .64, 1) 1; }
  @keyframes ckPop {
    0% { transform: translateX(-4px); }
    60% { transform: translateX(2px); }
    100% { transform: translateX(0); }
  }

  /* ---- 底部：进度条 + 耗时/版本 ---- */
  #hudbar { margin-top: 14px; width: 100%; flex: none; text-align: center; }
  #progress {
    position: relative;
    width: 240px; height: 2px;
    margin: 0 auto;
    border-radius: 2px;
    background: rgba(30, 58, 107, 0.55);
    overflow: hidden;
  }
  #progress::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 36%;
    background: linear-gradient(90deg, transparent, #3A7BFF, transparent);
    animation: slide 1.2s cubic-bezier(.45, .05, .55, .95) infinite;
  }
  @keyframes slide {
    from { transform: translateX(-110%); }
    to   { transform: translateX(380%); }
  }
  #metaline {
    margin-top: 12px;
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 11.5px;
    color: rgba(143, 168, 204, 0.6);
    letter-spacing: 0.4px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #metaline .sep { margin: 0 8px; color: rgba(30, 58, 107, 0.9); }
  #elapsed { color: rgba(143, 168, 204, 0.4); }

  /* gif 挂件：右下角，同主题挂件位（right 14 / bottom 12 / 圆角 14） */
  #mascot {
    position: fixed; right: 14px; bottom: 12px;
    width: 110px; height: auto;
    border-radius: 14px;
    object-fit: cover;
    opacity: 0.92;
    filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.5));
    pointer-events: none; user-select: none;
    z-index: 10;
  }

  /* ---- 谢幕要素 ---- */
  #shock {
    position: absolute;
    left: 50%; top: 50%;
    width: 50vh; height: 50vh;
    margin: -25vh 0 0 -25vh;
    border: 3px solid rgba(57, 255, 209, 0.9);
    border-radius: 50%;
    opacity: 0;
    z-index: 4;
    pointer-events: none;
  }
  #rays {
    position: absolute;
    left: 50%; top: 50%;
    width: 560px; height: 560px;
    margin: -280px 0 0 -280px;
    border-radius: 50%;
    background: repeating-conic-gradient(
      rgba(58, 123, 255, 0.1) 0deg 5deg,
      transparent 5deg 11deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 66%);
            mask-image: radial-gradient(circle, #000 0%, transparent 66%);
    opacity: 0;
    z-index: 5;
    pointer-events: none;
  }
  #cheer {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0.2) rotate(-8deg);
    font-size: 68px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #ffffff;
    -webkit-text-stroke: 3.5px #05070d;
    paint-order: stroke fill;
    text-shadow: 0 8px 34px rgba(0, 0, 0, 0.6), 0 0 34px rgba(58, 123, 255, 0.6);
    opacity: 0;
    z-index: 6;
    pointer-events: none;
    white-space: nowrap;
  }
  #flash {
    position: absolute; inset: 0;
    background: #eaf6ff;
    opacity: 0;
    z-index: 8;
    pointer-events: none;
  }

  /* ============ 谢幕编排（.out 由 __splashOut 触发）============ */
  #stage.out #fish-rig { animation: windup 0.15s ease-in forwards; }
  @keyframes windup {
    to { transform: translateY(-14px) rotate(-9deg) scale(1.04); }
  }
  #stage.out #fish { animation: slapFish 0.2s cubic-bezier(.2, .9, .3, 1) forwards 0.15s; }
  @keyframes slapFish {
    0% { transform: scale(1, 1); }
    40% { transform: rotate(11deg) scale(1.1, 0.9); }
    100% { transform: rotate(4deg) scale(1.02, 0.98); }
  }
  #stage.out #terminal { animation: termGlitch 0.3s steps(2) 3 0.15s, fadeOut 0.2s ease forwards 0.5s; }
  #stage.out #shock { animation: shockWave 0.55s cubic-bezier(.2, .7, .3, 1) forwards 0.16s; }
  @keyframes shockWave {
    0% { transform: scale(0.85); opacity: 0.95; border-width: 4px; }
    100% { transform: scale(2.6); opacity: 0; border-width: 1px; }
  }
  #stage.out #rig { animation: zoomRig 0.32s cubic-bezier(.34, 1.4, .64, 1) forwards 0.34s; }
  @keyframes zoomRig { to { transform: scale(2.05); } }
  #stage.out #rays { animation: raysIn 0.5s ease-out forwards 0.34s; }
  @keyframes raysIn {
    0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
    30% { opacity: 0.95; }
    100% { transform: rotate(24deg) scale(1.05); opacity: 0.6; }
  }
  #stage.out #cheer { animation: cheerIn 0.46s cubic-bezier(.34, 1.56, .64, 1) forwards 0.37s; }
  @keyframes cheerIn {
    0% { transform: translate(-50%, -50%) scale(0.2) rotate(-8deg); opacity: 0; }
    60% { transform: translate(-50%, -50%) scale(1.12) rotate(2deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) rotate(-1.5deg); opacity: 1; }
  }
  #stage.out #flash { animation: flashIn 0.5s ease-out forwards 0.62s; }
  @keyframes flashIn {
    0% { opacity: 0; }
    18% { opacity: 0.85; }
    100% { opacity: 0; }
  }
  #stage.out #console, #stage.out #hudbar, #stage.out #radar,
  #stage.out .sonar, #stage.out #glow, #stage.out #hud { animation: fadeOut 0.2s ease forwards 0.15s; }
  @keyframes fadeOut { to { opacity: 0; } }

  /* 减少动态偏好：静态候场（无数据雨、无上浮、无扫描），谢幕只做整页淡出 */
  @media (prefers-reduced-motion: reduce) {
    #fish-rig, #glow, #radar, .sonar, #progress::after, #caret { animation: none !important; }
    #rig { opacity: 1; animation: none !important; }
    #fx { display: none; }
    #stage.out #fish-rig, #stage.out #fish, #stage.out #rig, #stage.out #rays,
    #stage.out #cheer, #stage.out #shock, #stage.out #flash, #stage.out #terminal,
    #stage.out #console, #stage.out #hudbar, #stage.out #radar, #stage.out .sonar,
    #stage.out #glow, #stage.out #hud, #stage.out #wordmark { animation: none !important; transition: none !important; }
    #cheer { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="ambient"></div>
    <canvas id="fx"></canvas>

    <div id="scene">
      <div id="wordmark">DeepSeek Harness</div>
      <div id="rig">
        <div id="glow"></div>
        <div id="radar"></div>
        <span class="sonar"></span>
        <span class="sonar s2"></span>
        <svg id="hud" viewBox="0 0 560 560" fill="none">
          <g class="spin-a">
            <circle cx="280" cy="280" r="262" stroke="rgba(30,58,107,0.85)"
              stroke-width="1.5" stroke-dasharray="4 14" stroke-linecap="round" />
            <circle cx="280" cy="280" r="236" stroke="rgba(30,58,107,0.5)"
              stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round" />
          </g>
          <g class="spin-b">
            <circle cx="280" cy="280" r="248" stroke="rgba(58,123,255,0.55)"
              stroke-width="2" stroke-dasharray="46 700" stroke-linecap="round" />
          </g>
          <circle cx="280" cy="280" r="222" stroke="rgba(30,58,107,0.45)" stroke-width="1" />
          <!-- 四角括角 -->
          <path d="M26 70 L26 26 L70 26" stroke="rgba(58,123,255,0.5)" stroke-width="2" stroke-linecap="round" />
          <path d="M490 26 L534 26 L534 70" stroke="rgba(58,123,255,0.5)" stroke-width="2" stroke-linecap="round" />
          <path d="M534 490 L534 534 L490 534" stroke="rgba(58,123,255,0.5)" stroke-width="2" stroke-linecap="round" />
          <path d="M70 534 L26 534 L26 490" stroke="rgba(58,123,255,0.5)" stroke-width="2" stroke-linecap="round" />
        </svg>
        <div id="fish-rig">
          <div id="scanline"></div>
          <img id="fish" src="../assets/icon_app.png" alt="" draggable="false" />
        </div>
        <div id="shock"></div>
        <div id="rays"></div>
        <div id="cheer">开工！</div>
      </div>
      <div id="console">
        <div id="terminal"><span class="prompt">&gt;</span><span id="ttext">正在启动服务 …</span><span id="caret"></span></div>
        <div id="checklist">
          <div class="ck-row"><span class="mark">▸</span><span>定位 dsh CLI</span><span class="tag">[ -- ]</span></div>
          <div class="ck-row"><span class="mark">▸</span><span>启动服务</span><span class="tag">[ -- ]</span></div>
          <div class="ck-row"><span class="mark">▸</span><span>等待服务就绪</span><span class="tag">[ -- ]</span></div>
          <div class="ck-row"><span class="mark">▸</span><span>进入界面</span><span class="tag">[ -- ]</span></div>
        </div>
      </div>
      <div id="hudbar">
        <div id="progress"></div>
        <div id="metaline">
          <span id="elapsed">0.0 s</span><span class="sep" id="versep" hidden>·</span><span id="ver" hidden></span>
        </div>
      </div>
    </div>

    <div id="flash"></div>
    <img id="mascot" alt="" draggable="false" hidden />
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const gif = params.get('gif');
  if (gif) {
    const mascot = document.getElementById('mascot');
    mascot.src = 'file://' + gif.replace(/\\/g, '/');
    mascot.hidden = false;
  }
  const ver = params.get('ver');
  if (ver) {
    document.getElementById('ver').textContent = 'v' + ver;
    document.getElementById('ver').hidden = false;
    document.getElementById('versep').hidden = false;
  }

  /* ---- 阶段 → HUD 自检清单 ----
     main.js 的 splashStatus 按序推进：定位 → 启动服务 → 等待服务就绪 → 进入界面。
     match 是文本匹配优先级、row 是清单行号，两者必须分开：
     「进入界面」要先于「等待服务就绪」匹配，否则「服务就绪，正在进入界面 …」
     会被等待态吞掉、勾号停错行。 */
  const PHASES = [
    { match: '定位', row: 0 },
    { match: '启动服务', row: 1 },
    { match: '进入界面', row: 3 },
    { match: '等待服务就绪', row: 2 },
  ];
  const ckRows = Array.from(document.querySelectorAll('.ck-row'));
  let currentPhase = -1;

  function renderChecklist(row) {
    if (row === currentPhase) return;
    const prev = currentPhase;
    currentPhase = row;
    ckRows.forEach(function (r, i) {
      r.classList.remove('just-done');
      if (row < 0) return;
      if (i < row) {
        r.classList.add('done');
        r.classList.remove('active');
        r.querySelector('.tag').textContent = '[ OK ]';
      } else if (i === row) {
        r.classList.add('active');
        r.classList.remove('done');
        r.querySelector('.tag').textContent = '[ .. ]';
      } else {
        r.classList.remove('done', 'active');
        r.querySelector('.tag').textContent = '[ -- ]';
      }
    });
    if (prev >= 0 && prev < row && ckRows[prev]) {
      const r = ckRows[prev];
      r.classList.add('done');
      void r.offsetWidth;
      r.classList.add('just-done');
    }
  }

  /* ---- 终端打字机 ---- */
  const ttextEl = document.getElementById('ttext');
  const terminalEl = document.getElementById('terminal');
  let typeTimer = null;
  function typeText(text) {
    clearInterval(typeTimer);
    ttextEl.textContent = '';
    let i = 0;
    typeTimer = setInterval(function () {
      i++;
      ttextEl.textContent = text.slice(0, i);
      if (i >= text.length) clearInterval(typeTimer);
    }, 26);
  }

  /* ---- 实体化：扫描线掠过 + RGB 分离 + 终端故障 ---- */
  const fishRig = document.getElementById('fish-rig');
  let matTimer = null;
  function materialize() {
    fishRig.classList.remove('materialize');
    void fishRig.offsetWidth;
    fishRig.classList.add('materialize');
    clearTimeout(matTimer);
    matTimer = setTimeout(function () { fishRig.classList.remove('materialize'); }, 900);
    terminalEl.classList.remove('glitch');
    void terminalEl.offsetWidth;
    terminalEl.classList.add('glitch');
    setTimeout(function () { terminalEl.classList.remove('glitch'); }, 900);
  }

  window.__setStatus = function (text) {
    if (ttextEl.textContent === text && typeTimer) return;
    typeText(text);
    let row = -1;
    for (let i = 0; i < PHASES.length; i++) {
      if (text.indexOf(PHASES[i].match) !== -1) { row = PHASES[i].row; break; }
    }
    if (row >= 0) {
      renderChecklist(row);
      materialize();
    }
  };

  /* ---- 数据雨（皮肤的灵魂元素：青色数据雨，canvas 自绘）---- */
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let drops = [];
  let fxRaf = null;
  let lastT = 0;
  const RAIN_COLORS = [
    'rgba(30, 58, 107, ',    // 冷蓝（主）
    'rgba(58, 123, 255, ',   // 电光蓝
    'rgba(57, 255, 209, ',   // 状态青（少量）
  ];
  function fxResize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = Math.ceil(innerWidth / 16);
    drops = Array.from({ length: cols }, function (_, i) {
      return newDrop(i * 16 + 4, true);
    });
  }
  function newDrop(x, anywhere) {
    const cyan = Math.random() < 0.12;
    return {
      x: x,
      y: anywhere ? Math.random() * innerHeight : -20 - Math.random() * 60,
      len: 10 + Math.random() * 26,
      speed: 60 + Math.random() * 130,
      alpha: 0.1 + Math.random() * 0.35,
      color: cyan ? RAIN_COLORS[2] : (Math.random() < 0.4 ? RAIN_COLORS[1] : RAIN_COLORS[0]),
      head: cyan || Math.random() < 0.25,
    };
  }
  function fxTick(t) {
    const dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0.016;
    lastT = t;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      d.y += d.speed * dt;
      if (d.y - d.len > innerHeight) { drops[i] = newDrop(d.x, false); continue; }
      const top = Math.max(0, d.y - d.len);
      const g = ctx.createLinearGradient(d.x, top, d.x, d.y);
      g.addColorStop(0, d.color + '0)');
      g.addColorStop(1, d.color + d.alpha.toFixed(3) + ')');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(d.x, top);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();
      if (d.head) {
        ctx.fillStyle = d.color + Math.min(0.85, d.alpha + 0.4).toFixed(3) + ')';
        ctx.fillRect(d.x - 0.7, d.y - 1.4, 1.4, 2.8);
      }
    }
    fxRaf = requestAnimationFrame(fxTick);
  }
  if (!reduceMotion) {
    fxResize();
    fxTick(0);
    window.addEventListener('resize', fxResize);
  }

  // 启动耗时计时（0.1s 步进）
  const elapsedEl = document.getElementById('elapsed');
  let t0 = Date.now();
  let timer = null;
  const startTimer = function () {
    clearInterval(timer);
    t0 = Date.now();
    timer = setInterval(function () {
      elapsedEl.textContent = ((Date.now() - t0) / 1000).toFixed(1) + ' s';
    }, 100);
  };
  startTimer();

  // 主进程在服务就绪、即将加载界面时调用：播放谢幕编排（蓄力→拍走→放大欢呼→白闪）
  // 约 1.1s 后整页淡出。时序与 main.js 的 withTimeout(splashOut(), 1200) 串行等待
  // 配套：1.1s 已贴近上限，不得再加长
  window.__splashOut = function () {
    return new Promise(function (resolve) {
      clearInterval(timer);
      clearInterval(typeTimer);
      if (fxRaf) cancelAnimationFrame(fxRaf);
      const stage = document.getElementById('stage');
      stage.classList.remove('out');
      void stage.offsetWidth;
      stage.classList.add('out');
      setTimeout(function () {
        stage.classList.add('leaving');
        setTimeout(resolve, 220);
      }, 880);
    });
  };

  // 淡出后需要回退重试（预热服务失联转自启动）时，恢复候场并重置计时
  window.__splashIn = function () {
    const stage = document.getElementById('stage');
    stage.classList.remove('out', 'leaving');
    startTimer();
  };
</script>
</body>
