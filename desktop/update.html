<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DeepSeek Harness 更新</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #1b1b1f; color: #d4d4d4;
    padding: 22px 26px; font-size: 13px; user-select: none;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  h1 { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ver { font-family: Consolas, monospace; }
  .tag {
    display: inline-block; padding: 1px 9px; border-radius: 9px; font-size: 11px;
    background: rgba(87,171,90,.16); color: #7bc882; border: 1px solid rgba(87,171,90,.35);
  }
  .muted { color: #a0a0ab; font-size: 12px; white-space: pre-line; }
  section { display: none; flex: 1; min-height: 0; flex-direction: column; }
  body[data-phase="found"] section.found,
  body[data-phase="installing"] section.installing,
  body[data-phase="done"] section.done,
  body[data-phase="failed"] section.failed { display: flex; }

  /* 不定进度条：npm install 无可靠百分比，滚动条 + 实时日志如实反映进度 */
  .bar { height: 6px; border-radius: 3px; background: #2a2a30; overflow: hidden; margin: 14px 0 8px; flex: none; }
  .bar > i {
    display: block; height: 100%; width: 40%; border-radius: 3px;
    background: linear-gradient(90deg, #4f8ef7, #7ab2ff);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }

  pre {
    flex: 1; min-height: 0; overflow-y: auto; margin-top: 10px; padding: 10px 12px;
    background: #141416; border: 1px solid #2c2c33; border-radius: 6px;
    font: 11px/1.5 Consolas, monospace; color: #9cdcfe;
    white-space: pre-wrap; word-break: break-all; user-select: text;
  }
  .btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: auto; padding-top: 16px; flex: none; }
  button {
    padding: 6px 18px; border-radius: 6px; border: 1px solid #3a3a42;
    background: #2b2b31; color: #d4d4d4; cursor: pointer; font-size: 13px; font-family: inherit;
  }
  button:hover { background: #35353c; }
  button.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  button.primary:hover { background: #3d7bf0; }

  /* 更新说明区（found 阶段）：渲染规则与 notes.html 一致 */
  h2.sec { font-size: 12.5px; color: #a0a0ab; font-weight: 600; margin: 14px 0 0; flex: none; }
  .notes {
    flex: 1; min-height: 0; overflow-y: auto; margin-top: 6px; padding: 8px 12px;
    background: #141416; border: 1px solid #2c2c33; border-radius: 6px;
    user-select: text; line-height: 1.6; font-size: 12.5px;
  }
  .notes h4 { color: #fff; font-size: 12.5px; margin: 10px 0 4px; }
  .notes h3 { color: #fff; font-size: 13.5px; margin: 8px 0 4px; }
  .notes ul { margin: 2px 0 8px 18px; }
  .notes li { margin: 3px 0; }
  .notes p { margin: 4px 0; }
  .notes code {
    background: #1b1b1f; border: 1px solid #2c2c33; border-radius: 3px;
    padding: 0 4px; font-family: Consolas, monospace; font-size: 11.5px; color: #9cdcfe;
  }
  .notes .lnk { color: #4d86fe; }
  .notes hr { border: none; border-top: 1px solid #2c2c33; margin: 8px 0; }
  .notes .empty { color: #8a8a94; }
</style>
</head>
<body data-phase="found">

<section class="found">
  <h1>发现新版本 <span class="ver" id="f-latest"></span></h1>
  <div class="row">
    <span class="tag" id="f-channel"></span>
    <span class="muted" id="f-meta"></span>
  </div>
  <p class="muted" id="f-detail" style="margin-top:8px"></p>
  <h2 class="sec">本次更新内容</h2>
  <div class="notes" id="f-notes"><div class="empty">正在获取官方发布说明…</div></div>
  <div class="btns">
    <button id="b-cancel">取消</button>
    <button class="primary" id="b-install">立即更新</button>
  </div>
</section>

<section class="installing">
  <h1>正在更新到 <span class="ver" id="i-latest"></span></h1>
  <div class="bar"><i></i></div>
  <p class="muted" id="i-status">正在从 registry 下载并安装…（已用时 0s，完成后自动校验版本）</p>
  <p class="muted" style="margin-top:4px">关闭此窗口不会中断安装，随时点版本徽标回到本进度。</p>
  <pre id="log"></pre>
  <div class="btns">
    <button id="b-hide">后台安装，关闭窗口</button>
  </div>
</section>

<section class="done">
  <h1>✅ 已更新到 <span class="ver" id="d-latest"></span></h1>
  <p class="muted" id="d-meta" style="margin-top:6px"></p>
  <p class="muted" id="d-prewarm" style="margin-top:4px"></p>
  <div class="btns">
    <button id="b-recheck-d">重新检查</button>
    <button id="b-later">稍后重启</button>
    <button class="primary" id="b-restart">立即重启</button>
  </div>
</section>

<section class="failed">
  <h1 style="color:#f07178">❌ 更新失败</h1>
  <p class="muted" id="x-detail" style="margin-top:6px"></p>
  <pre id="x-log"></pre>
  <div class="btns">
    <button id="b-recheck-x">重新检查</button>
    <button class="primary" id="b-close">关闭</button>
  </div>
</section>

<script>
  const $ = (id) => document.getElementById(id)
  let phase = 'found'
  let startedAt = Date.now()
  let prewarm = 'none'
  setInterval(() => {
    if (phase === 'installing') {
      $('i-status').textContent =
        `正在从 registry 下载并安装…（已用时 ${Math.round((Date.now() - startedAt) / 1000)}s，完成后自动校验版本）`
    }
  }, 1000)

  /* 官方 release body 是「markdown + 内嵌 h3 标签」混排，归一化后转义、按行渲染（与 notes.html 同规则） */
  function renderNotes(body) {
    let t = body || ''
    const en = t.search(/<h3[^>]*id="en-/)
    if (en > 0) t = t.slice(0, en)
    t = t.replace(/^\s*\[[^\]]+\]\(#[^)]*\)\s*\|.*$/m, '')
    t = t.replace(/<h3[^>]*>/gi, '\n### ').replace(/<\/h3>/gi, '\n')
         .replace(/<h2[^>]*>/gi, '\n## ').replace(/<\/h2>/gi, '\n')
         .replace(/<br\s*\/?>/gi, '\n')
         .replace(/<\/?(strong|em|code|a|span|p)[^>]*>/gi, '')
    t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    const inline = (s) => s
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, txt, href) =>
        /^https?:\/\//i.test(href) ? '<span class="lnk">' + txt + '</span>' : txt)
    let html = '', inList = false
    const closeList = () => { if (inList) { html += '</ul>'; inList = false } }
    for (const raw of t.split(/\r?\n/)) {
      const line = raw.trimEnd()
      if (/^###\s+/.test(line)) { closeList(); html += '<h4>' + inline(line.replace(/^###\s+/, '')) + '</h4>' }
      else if (/^##\s+/.test(line)) { closeList(); html += '<h3>' + inline(line.replace(/^##\s+/, '')) + '</h3>' }
      else if (/^[-*]\s+/.test(line)) { if (!inList) { html += '<ul>'; inList = true } html += '<li>' + inline(line.replace(/^[-*]\s+/, '')) + '</li>' }
      else if (/^---+$/.test(line.trim())) { closeList(); html += '<hr>' }
      else if (line.trim() === '') { closeList() }
      else { closeList(); html += '<p>' + inline(line) + '</p>' }
    }
    closeList()
    return html
  }

  const PREWARM_TEXT = {
    warming: '新版服务正在后台预热（新文件首次需过杀毒扫描）……预热完成后再点「立即重启」，重启后即刻进入界面；现在重启也行，只是首屏会多等一会。',
    ready: '✓ 新版服务已预热完成，点「立即重启」即刻进入新版本界面。',
    failed: '新版服务预热未完成，重启后首次启动需等待 10~40s（新文件杀毒扫描），属一次性开销。',
    none: '',
  }
  function renderPrewarm() {
    const el = $('d-prewarm')
    if (!el) return
    el.textContent = PREWARM_TEXT[prewarm] || ''
    $('b-restart').textContent = prewarm === 'ready' ? '立即重启（已就绪）' : '立即重启'
  }

  window.dshUpdate.onEvent((ev) => {
    if (ev.type === 'phase') {
      phase = ev.phase
      document.body.dataset.phase = ev.phase
      if (ev.phase === 'found') {
        $('f-latest').textContent = 'v' + ev.latest
        $('f-channel').textContent = ev.channel
        $('f-meta').textContent = (ev.publishedAt ? '发布于 ' + ev.publishedAt : '') + ' · 当前 v' + ev.current
        $('f-detail').textContent = '更新将安装到应用数据目录，安装完成后可选择立即重启生效。\n' + ev.registry
        $('f-notes').innerHTML = renderNotes(ev.notes) ||
          '<div class="empty">该版本暂无官方发布说明（内测版本可能未同步到 GitHub Releases）</div>'
      } else if (ev.phase === 'installing') {
        $('i-latest').textContent = 'v' + ev.version
        if (typeof ev.elapsedSec === 'number') startedAt = Date.now() - ev.elapsedSec * 1000
      } else if (ev.phase === 'done') {
        $('d-latest').textContent = 'v' + ev.version
        $('d-meta').textContent = `用时 ${ev.seconds}s，已校验安装目录版本无误。重启后新版本生效。`
        prewarm = ev.prewarm || 'none'
        renderPrewarm()
      } else if (ev.phase === 'failed') {
        $('x-detail').textContent = ev.detail || '未知错误'
        $('x-log').textContent = $('log').textContent || '（无安装输出）'
      }
    } else if (ev.type === 'log') {
      const el = $('log')
      el.textContent += ev.text + '\n'
      el.scrollTop = el.scrollHeight
    } else if (ev.type === 'prewarm') {
      prewarm = ev.state || 'none'
      renderPrewarm()
    }
  })

  $('b-install').addEventListener('click', () => window.dshUpdate.start())
  $('b-cancel').addEventListener('click', () => window.dshUpdate.close())
  $('b-hide').addEventListener('click', () => window.dshUpdate.close())
  $('b-restart').addEventListener('click', () => window.dshUpdate.restart())
  $('b-later').addEventListener('click', () => window.dshUpdate.close())
  $('b-close').addEventListener('click', () => window.dshUpdate.close())
  $('b-recheck-d').addEventListener('click', () => window.dshUpdate.recheck())
  $('b-recheck-x').addEventListener('click', () => window.dshUpdate.recheck())
</script>
</body>
</html>
