<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>版本说明与更新 — DeepSeek Harness</title>
<style>
  /* ============ 主题变量：:root 深色（默认，维持原视觉），body[data-theme="light"] 浅色 ============ */
  :root {
    color-scheme: dark;
    --n-bg: #1b1b1f;             /* 页面底色 */
    --n-fg: #d4d4d4;             /* 正文前景 */
    --n-fg-strong: #ffffff;      /* 标题前景 */
    --n-fg-soft: #a0a0ab;        /* 状态行 / 次要说明 */
    --n-fg-summary: #c8c8d0;     /* 历史面板一级摘要 */
    --n-fg-item: #b8b8c0;        /* 历史面板条目摘要 */
    --n-muted: #8a8a94;          /* 弱化文本（meta/empty/loading） */
    --n-border: #2c2c33;         /* 常规边框 / 分隔线 */
    --n-border-soft: #242429;    /* 折叠面板内分隔线 */
    --n-accent: #4d86fe;         /* 主题色（链接/版本号/高亮） */
    --n-accent-hover: #7aa6ff;   /* 主题色悬停 */
    --n-surface: #141416;        /* 面板底（代码/日志/更新说明） */
    --n-panel-bg: #17171a;       /* 历史折叠面板底 */
    --n-code-fg: #9cdcfe;        /* 代码/日志前景 */
    --n-btn-bg: #2b2b31;         /* 普通按钮 */
    --n-btn-border: #3a3a42;
    --n-btn-fg: #d4d4d4;
    --n-btn-hover: #35353c;
    --n-primary-bg: #2f6fed;     /* 主按钮 */
    --n-primary-border: #2f6fed;
    --n-primary-fg: #ffffff;
    --n-primary-hover: #3d7bf0;
    --n-tag-bg: rgba(87,171,90,.16);  /* 渠道徽章 */
    --n-tag-fg: #7bc882;
    --n-tag-border: rgba(87,171,90,.35);
    --n-bar-bg: #2a2a30;         /* 进度条槽 */
    --n-bar-1: #4f8ef7;          /* 进度条渐变 */
    --n-bar-2: #7ab2ff;
    --n-danger: #f07178;         /* 错误/失败 */
  }
  body[data-theme="light"] {
    color-scheme: light;
    --n-bg: #f3f3f3;
    --n-fg: #1b1b1c;
    --n-fg-strong: #101012;
    --n-fg-soft: #5d5d66;
    --n-fg-summary: #3a3a42;
    --n-fg-item: #4a4a52;
    --n-muted: #6b6b74;
    --n-border: rgba(0,0,0,0.08);
    --n-border-soft: rgba(0,0,0,0.06);
    --n-accent: #2f6fed;
    --n-accent-hover: #1e56c9;
    --n-surface: #ffffff;
    --n-panel-bg: #ffffff;
    --n-code-fg: #0451a5;
    --n-btn-bg: #ececec;
    --n-btn-border: rgba(0,0,0,0.12);
    --n-btn-fg: #1b1b1c;
    --n-btn-hover: #e0e0e0;
    --n-primary-bg: #2f6fed;
    --n-primary-border: #2f6fed;
    --n-primary-fg: #ffffff;
    --n-primary-hover: #1e5ed1;
    --n-tag-bg: rgba(16,124,16,.10);
    --n-tag-fg: #107c10;
    --n-tag-border: rgba(16,124,16,.35);
    --n-bar-bg: rgba(0,0,0,0.08);
    --n-bar-1: #2f6fed;
    --n-bar-2: #5e93f8;
    --n-danger: #d13438;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--n-bg); color: var(--n-fg); font-size: 13px;
    height: 100vh; overflow: hidden; user-select: none;
  }
  button {
    padding: 6px 16px; border-radius: 6px; border: 1px solid var(--n-btn-border);
    background: var(--n-btn-bg); color: var(--n-btn-fg); cursor: pointer; font-size: 12px; font-family: inherit;
  }
  button:hover { background: var(--n-btn-hover); }
  button.primary { background: var(--n-primary-bg); border-color: var(--n-primary-border); color: var(--n-primary-fg); }
  button.primary:hover { background: var(--n-primary-hover); }

  /* ============ 视图切换：版本说明 / 更新流程（单窗口两视图） ============ */
  #view-notes, #view-update { height: 100%; display: none; flex-direction: column; }
  body[data-view="notes"] #view-notes { display: flex; }
  body[data-view="update"] #view-update { display: flex; }

  /* ============ 版本说明视图 ============ */
  header { padding: 16px 22px 12px; border-bottom: 1px solid var(--n-border); flex: none; }
  .row { display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 15px; font-weight: 600; color: var(--n-fg-strong); flex: 1; }
  h1 .ver { color: var(--n-accent); }
  .status { margin-top: 8px; font-size: 12px; color: var(--n-fg-soft); min-height: 16px; white-space: pre-line; }
  .status .hl { color: var(--n-accent); }
  .status .hl.go-ver { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .status .hl.go-ver:hover { color: var(--n-accent-hover); }
  .status .err { color: var(--n-danger); }
  #view-notes > main { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 22px 18px; }
  h2.sec { font-size: 13px; color: var(--n-fg-strong); margin: 4px 0 8px; }
  .meta { color: var(--n-muted); font-size: 11px; margin-bottom: 8px; }
  .notes { user-select: text; line-height: 1.65; font-size: 12.5px; }
  .notes h4 { color: var(--n-fg-strong); font-size: 12.5px; margin: 12px 0 4px; }
  .notes h3 { color: var(--n-fg-strong); font-size: 13.5px; margin: 10px 0 4px; }
  .notes ul { margin: 2px 0 8px 18px; }
  .notes li { margin: 3px 0; }
  .notes p { margin: 4px 0; }
  .notes code {
    background: var(--n-surface); border: 1px solid var(--n-border); border-radius: 3px;
    padding: 0 4px; font-family: Consolas, monospace; font-size: 11.5px; color: var(--n-code-fg);
  }
  .notes .lnk { color: var(--n-accent); }
  .notes hr { border: none; border-top: 1px solid var(--n-border); margin: 10px 0; }
  .empty { color: var(--n-muted); padding: 18px 0; }
  details.hist { border: 1px solid var(--n-border); border-radius: 6px; margin-top: 8px; background: var(--n-panel-bg); }
  details.hist > summary {
    cursor: pointer; padding: 9px 12px; color: var(--n-fg-summary); font-size: 12.5px; list-style: none;
  }
  details.hist > summary::before { content: '▸ '; color: var(--n-muted); }
  details.hist[open] > summary::before { content: '▾ '; }
  details.hist > summary:hover { color: var(--n-fg-strong); }
  details.hist .item { border-top: 1px solid var(--n-border-soft); padding: 10px 12px; }
  details.hist .item > summary { cursor: pointer; color: var(--n-fg-item); font-size: 12px; list-style: none; }
  details.hist .item > summary::before { content: '▸ '; color: var(--n-muted); }
  details.hist .item[open] > summary::before { content: '▾ '; }
  details.hist .item > summary:hover { color: var(--n-fg-strong); }
  details.hist .item .ver { color: var(--n-accent); font-weight: 600; }
  details.hist .item .meta { display: inline; margin-left: 8px; }
  details.hist .item .notes { padding: 6px 2px 2px; }
  .foot { padding: 10px 22px 14px; border-top: 1px solid var(--n-border); flex: none; display: flex; justify-content: space-between; align-items: center; }
  .foot .muted { color: var(--n-muted); font-size: 11px; }
  .loading { color: var(--n-muted); padding: 14px 0; }

  /* ============ 更新流程视图（found / installing / done / failed） ============ */
  #view-update { padding: 22px 26px; }
  #view-update section { display: none; flex: 1; min-height: 0; flex-direction: column; }
  /* 阶段选择器必须带 #view-update 前缀：默认隐藏规则含 ID（特异性 1,0,1），
     不带前缀的属性选择器（0,3,2）赢不了它，四个阶段 section 会永远隐藏 → 整窗空白 */
  body[data-view="update"][data-phase="found"] #view-update section.found,
  body[data-view="update"][data-phase="installing"] #view-update section.installing,
  body[data-view="update"][data-phase="done"] #view-update section.done,
  body[data-view="update"][data-phase="failed"] #view-update section.failed { display: flex; }
  #view-update h1 { margin-bottom: 10px; flex: none; }
  .urow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: none; }
  .ver { font-family: Consolas, monospace; }
  .tag {
    display: inline-block; padding: 1px 9px; border-radius: 9px; font-size: 11px;
    background: var(--n-tag-bg); color: var(--n-tag-fg); border: 1px solid var(--n-tag-border);
  }
  .muted { color: var(--n-fg-soft); font-size: 12px; white-space: pre-line; }
  /* 不定进度条：npm install 无可靠百分比，滚动条 + 实时日志如实反映进度 */
  .bar { height: 6px; border-radius: 3px; background: var(--n-bar-bg); overflow: hidden; margin: 14px 0 8px; flex: none; }
  .bar > i {
    display: block; height: 100%; width: 40%; border-radius: 3px;
    background: linear-gradient(90deg, var(--n-bar-1), var(--n-bar-2));
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
  pre {
    flex: 1; min-height: 0; overflow-y: auto; margin-top: 10px; padding: 10px 12px;
    background: var(--n-surface); border: 1px solid var(--n-border); border-radius: 6px;
    font: 11px/1.5 Consolas, monospace; color: var(--n-code-fg);
    white-space: pre-wrap; word-break: break-all; user-select: text;
  }
  h2.sec2 { font-size: 12.5px; color: var(--n-fg-soft); font-weight: 600; margin: 14px 0 0; flex: none; }
  .unotes {
    flex: 1; min-height: 0; overflow-y: auto; margin-top: 6px; padding: 8px 12px;
    background: var(--n-surface); border: 1px solid var(--n-border); border-radius: 6px;
    user-select: text; line-height: 1.6; font-size: 12.5px;
  }
  .unotes h4 { color: var(--n-fg-strong); font-size: 12.5px; margin: 10px 0 4px; }
  .unotes h3 { color: var(--n-fg-strong); font-size: 13.5px; margin: 8px 0 4px; }
  .unotes ul { margin: 2px 0 8px 18px; }
  .unotes li { margin: 3px 0; }
  .unotes p { margin: 4px 0; }
  .unotes code {
    background: var(--n-bg); border: 1px solid var(--n-border); border-radius: 3px;
    padding: 0 4px; font-family: Consolas, monospace; font-size: 11.5px; color: var(--n-code-fg);
  }
  .unotes .lnk { color: var(--n-accent); }
  .unotes hr { border: none; border-top: 1px solid var(--n-border); margin: 8px 0; }
  .unotes .empty { color: var(--n-muted); }
  .btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: auto; padding-top: 16px; flex: none; }
  /* failed 标题在 DOM 里带内联 style="color:#f07178"（内联样式特异性最高，
     只能靠 !important 覆盖），使其跟随主题而不动 DOM */
  #view-update section.failed h1 { color: var(--n-danger) !important; }
</style>
<style>
  /* ============ found 视图：可更新目标卡片（运行时 / 壳） ============ */
  .tgt {
    border: 1px solid var(--n-border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .tgt .urow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tgt .unotes { margin-top: 10px; max-height: 180px; overflow-y: auto; }
</style>
</head>
<body data-view="notes">

<div id="view-notes">
  <header>
    <div class="row">
      <h1>DeepSeek Harness <span class="ver" id="cur-ver"></span></h1>
      <button class="primary" id="b-action">检查更新</button>
    </div>
    <div class="status" id="status"></div>
  </header>
  <main>
    <h2 class="sec">当前版本更新说明</h2>
    <div class="meta" id="cur-meta"></div>
    <div class="notes" id="cur-notes"><div class="loading">正在获取官方发布说明…</div></div>

    <details class="hist" id="hist" style="display:none">
      <summary>历史版本更新说明</summary>
      <div id="hist-list"></div>
    </details>
  </main>
  <div class="foot">
    <span class="muted" id="cache-hint"></span>
    <button id="b-close">关闭</button>
  </div>
</div>

<div id="view-update">

  <section class="found">
    <h1>发现可用更新</h1>
    <div id="f-targets"></div>
    <div class="btns">
      <button id="b-back-f">返回版本说明</button>
    </div>
  </section>

  <section class="installing">
    <h1>正在更新到 <span class="ver" id="i-latest"></span></h1>
    <div class="bar"><i></i></div>
    <p class="muted" id="i-status">正在从 registry 下载并安装…（已用时 0s，完成后自动校验版本）</p>
    <p class="muted" style="margin-top:4px">安装期间界面服务会短暂停止（避免文件占用导致安装失败），完成后自动恢复；关闭此窗口不会中断安装，随时点版本徽标回到本进度。</p>
    <pre id="log"></pre>
    <div class="btns">
      <button id="b-back-i">返回版本说明</button>
      <button id="b-hide">后台安装，关闭窗口</button>
    </div>
  </section>

  <section class="done">
    <h1>✅ 已更新到 <span class="ver" id="d-latest"></span></h1>
    <p class="muted" id="d-meta" style="margin-top:6px"></p>
    <p class="muted" id="d-prewarm" style="margin-top:4px"></p>
    <div class="btns">
      <button id="b-recheck-d">重新检查</button>
      <button id="b-back-d">返回版本说明</button>
      <button class="primary" id="b-restart">立即重启</button>
    </div>
  </section>

  <section class="failed">
    <h1 style="color:#f07178">❌ 更新失败</h1>
    <p class="muted" id="x-detail" style="margin-top:6px"></p>
    <pre id="x-log"></pre>
    <div class="btns">
      <button id="b-back-x">返回版本说明</button>
      <button id="b-recheck-x">重新检查</button>
      <button class="primary" id="b-uclose">关闭</button>
    </div>
  </section>

</div>

<script>
  const $ = (id) => document.getElementById(id)
  const stripTag = (v) => String(v || '').replace(/^dsh-v/, '').replace(/^v/, '')

  /* 官方 release body 是「markdown + 内嵌 h3 标签」的混排，先归一化再转义、按行渲染 */
  function renderNotes(body) {
    let t = body || ''
    const en = t.search(/<h3[^>]*id="en-/)
    if (en > 0) t = t.slice(0, en)
    t = t.replace(/^\s*\[[^\]]+\]\(#[^)]*\)\s*\|.*$/m, '')
    t = t.replace(/<h3[^>]*>/gi, '\n### ').replace(/<\/h3>/gi, '\n')
         .replace(/<h2[^>]*>/gi, '\n## ').replace(/<\/h2>/gi, '\n')
         .replace(/<br\s*\/?>/gi, '\n')
         .replace(/<\/?(strong|em|code|a|span|p)[^>]*>/gi, '')
    t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    const inline = (s) => s
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, txt, href) =>
        /^https?:\/\//i.test(href) ? '<span class="lnk">' + txt + '</span>' : txt)
    let html = '', inList = false
    const closeList = () => { if (inList) { html += '</ul>'; inList = false } }
    for (const raw of t.split(/\r?\n/)) {
      const line = raw.trimEnd()
      if (/^###\s+/.test(line)) { closeList(); html += '<h4>' + inline(line.replace(/^###\s+/, '')) + '</h4>' }
      else if (/^##\s+/.test(line)) { closeList(); html += '<h3>' + inline(line.replace(/^##\s+/, '')) + '</h3>' }
      else if (/^[-*]\s+/.test(line)) { if (!inList) { html += '<ul>'; inList = true } html += '<li>' + inline(line.replace(/^[-*]\s+/, '')) + '</li>' }
      else if (/^---+$/.test(line.trim())) { closeList(); html += '<hr>' }
      else if (line.trim() === '') { closeList() }
      else { closeList(); html += '<p>' + inline(line) + '</p>' }
    }
    closeList()
    return html
  }

  /* ==================== 版本说明视图 ==================== */

  function notesBlock(r) {
    const ver = stripTag(r.name || r.tag)
    const date = (r.publishedAt || '').slice(0, 10)
    const inner = renderNotes(r.body)
    return { ver, date, inner }
  }

  async function init() {
    const st = await window.dshUpdate.notesState()
    $('cur-ver').textContent = st.current ? 'v' + st.current : '（版本未知）'
    refreshAction(st)
    setInterval(async () => refreshAction(await window.dshUpdate.notesState()), 3000)

    const r = await window.dshUpdate.fetchNotes()
    if (!r.ok) {
      $('cur-notes').innerHTML = '<div class="empty">获取发布说明失败：' + (r.error || '未知错误') +
        '<br>官方地址：https://github.com/deepseek-ai/deepseek-harness/releases</div>'
      return
    }
    if (r.fromCache) {
      $('cache-hint').textContent = '离线缓存' + (r.fetchedAt ? '（更新于 ' + r.fetchedAt.slice(0, 10) + '）' : '')
    }
    const releases = r.releases || []
    if (!releases.length) {
      $('cur-notes').innerHTML = '<div class="empty">官方仓库暂无发布说明</div>'
      return
    }
    const cur = releases.find(x => stripTag(x.name) === st.current || stripTag(x.tag) === st.current)
    if (cur) {
      const b = notesBlock(cur)
      $('cur-meta').textContent = (b.date ? '发布于 ' + b.date : '') + (cur.tag ? ' · ' + cur.tag : '')
      $('cur-notes').innerHTML = b.inner || '<div class="empty">该版本暂无发布说明</div>'
    } else {
      $('cur-meta').textContent = '未在官方 Releases 中找到当前版本的说明，以下为最新版本：'
      const b = notesBlock(releases[0])
      $('cur-notes').innerHTML = (b.date ? '<div class="meta">' + b.ver + ' · ' + b.date + '</div>' : '') + b.inner
    }

    const rest = releases.filter(x => x !== cur)
    if (rest.length) {
      $('hist').style.display = ''
      $('hist-list').innerHTML = rest.map((x) => {
        const b = notesBlock(x)
        return '<details class="item"><summary><span class="ver">v' + b.ver +
          '</span><span class="meta">' + (b.date || '') + '</span></summary><div class="notes">' +
          (b.inner || '<div class="empty">无说明</div>') + '</div></details>'
      }).join('')
    }
  }

  /* 手动「检查更新」的结果常驻显示：3s 轮询会重写状态行，没这个标志会被擦成空白
     （曾表现为「已是最新版本」闪一下就消失）。有更新/安装等状态变化时才让位。 */
  let manualNotice = ''

  function refreshAction(st) {
    const b = $('b-action')
    const s = $('status')
    if (st.update) {
      manualNotice = ''
      const map = {
        installing: ['查看安装进度', '正在后台安装 v' + st.update.version + '，可关闭窗口，随时回到进度'],
        done: ['查看更新结果', 'v' + st.update.version + ' 已安装完成，重启后生效'],
        failed: ['查看失败详情', '更新失败：' + (st.update.detail || '未知原因')],
      }
      const [label, hint] = map[st.update.phase] || ['查看更新进度', '']
      b.textContent = label
      s.innerHTML = hint ? '<span class="hl">' + hint + '</span>' : ''
    } else if (st.available) {
      manualNotice = ''
      b.textContent = '检查更新'
      s.innerHTML = '发现新版本 <span class="hl go-ver" id="go-ver">v' + st.available + '</span>，点击版本号即可查看更新内容并更新'
    } else {
      b.textContent = '检查更新'
      s.innerHTML = manualNotice
    }
  }

  /* ==================== 更新流程视图（与说明同窗，不再另开弹窗） ==================== */

  let phase = 'found'
  let startedAt = Date.now()
  let prewarm = 'none'
  setInterval(() => {
    if (document.body.dataset.view === 'update' && phase === 'installing') {
      $('i-status').textContent =
        `正在从 registry 下载并安装…（已用时 ${Math.round((Date.now() - startedAt) / 1000)}s，完成后自动校验版本）`
    }
  }, 1000)

  const PREWARM_TEXT = {
    warming: '新版服务正在后台预热（新文件首次需过杀毒扫描）……预热完成后再点「立即重启」，重启后即刻进入界面；现在重启也行，只是首屏会多等一会。',
    ready: '✓ 新版服务已预热完成，点「立即重启」即刻进入新版本界面。',
    failed: '新版服务预热未完成，重启后首次启动需等待 10~40s（新文件杀毒扫描），属一次性开销。',
    none: '',
  }
  function renderPrewarm() {
    const el = $('d-prewarm')
    if (!el) return
    el.textContent = PREWARM_TEXT[prewarm] || ''
    $('b-restart').textContent = prewarm === 'ready' ? '立即重启（已就绪）' : '立即重启'
  }

  window.dshUpdate.onEvent((ev) => {
    if (ev.type === 'phase') {
      phase = ev.phase
      document.body.dataset.view = 'update'
      document.body.dataset.phase = ev.phase
      if (ev.phase === 'found') {
        window.__shellFlow = false
        renderFoundTargets(ev.targets || [], ev.current, ev.shellCurrent)
      } else if (ev.phase === 'installing') {
        window.__shellFlow = false
        const bar = document.querySelector('#view-update .bar i')
        if (bar) bar.style.cssText = ''
        $('i-latest').textContent = 'v' + ev.version
        if (typeof ev.elapsedSec === 'number') startedAt = Date.now() - ev.elapsedSec * 1000
      } else if (ev.phase === 'done') {
        $('d-latest').textContent = 'v' + ev.version
        $('d-meta').textContent = `用时 ${ev.seconds}s，已校验安装目录版本无误，新版服务正在自动接管（首次启动新文件需过杀毒扫描，稍等片刻即可继续使用）。`
        prewarm = ev.prewarm || 'none'
        renderPrewarm()
      } else if (ev.phase === 'failed') {
        $('x-detail').textContent = ev.detail || '未知错误'
        $('x-log').textContent = $('log').textContent || '（无安装输出）'
      }
    } else if (ev.type === 'log') {
      const el = $('log')
      el.textContent += ev.text + '\n'
      el.scrollTop = el.scrollHeight
    } else if (ev.type === 'prewarm') {
      prewarm = ev.state || 'none'
      renderPrewarm()
    }
  })

  /* ---- found 视图：按 targets 渲染可更新目标卡片（runtime / shell） ---- */
  function renderFoundTargets(targets, current, shellCurrent) {
    const box = $('f-targets')
    box.innerHTML = targets.map((t) => {
      if (t.kind === 'shell') {
        const mb = t.size ? (t.size / 1048576).toFixed(1) + ' MB' : ''
        return '<div class="tgt" data-kind="shell">' +
          '<div class="urow"><h2 style="margin:0;font-size:15px">桌面壳 <span class="ver">v' + t.latest + '</span></h2>' +
          (mb ? '<span class="muted">' + mb + '</span>' : '') + '</div>' +
          '<p class="muted" style="margin:8px 0 0">当前壳 v' + (shellCurrent || '') + ' → v' + t.latest +
          '。下载安装包后自动静默安装并重启，会话与设置不受影响。</p>' +
          (t.notes ? '<div class="unotes">' + (renderNotes(t.notes) || '') + '</div>' : '') +
          '<div class="btns"><button class="primary" data-act="shell">下载并安装</button></div></div>'
      }
      return '<div class="tgt" data-kind="runtime">' +
        '<div class="urow"><h2 style="margin:0;font-size:15px">dsh 运行时 <span class="ver">v' + t.latest + '</span></h2>' +
        '<span class="tag">' + (t.channel || '') + '</span>' +
        (t.publishedAt ? '<span class="muted">发布于 ' + t.publishedAt + '</span>' : '') + '</div>' +
        '<p class="muted" style="margin:8px 0 0">当前 v' + (current || '') + ' → v' + t.latest +
        '。安装到应用数据目录，期间服务短暂停止、完成后自动升级，无需重启应用。</p>' +
        '<div class="unotes">' + (renderNotes(t.notes) || '<div class="empty">正在获取官方发布说明…</div>') + '</div>' +
        '<div class="btns"><button class="primary" data-act="runtime">立即更新</button></div></div>'
    }).join('')
  }

  /* found 目标卡片动作（runtime: 运行时流；shell: 壳下载安装流） */
  $('f-targets').addEventListener('click', (e) => {
    const act = e.target && e.target.dataset ? e.target.dataset.act : ''
    if (act === 'runtime') window.dshUpdate.start()
    else if (act === 'shell') {
      window.dshUpdate.shellCheck().then((r) => {
        window.__shellLatest = (r && r.found) ? r : window.__shellLatest
        window.__shellFlow = true
        window.dshUpdate.shellDownload()
      })
    }
  })

  /* ---- 壳更新四阶段（复用 installing/done/failed 视图，与运行时流同一套交互） ---- */
  if (typeof window.dshUpdate.onShellUpdateEvent === 'function') {
    window.dshUpdate.onShellUpdateEvent((e) => {
      if (e.type === 'download-start') {
        phase = 'installing'
        window.__shellFlow = true
        document.body.dataset.view = 'update'
        document.body.dataset.phase = 'installing'
        $('i-latest').textContent = 'v' + e.latest
        startedAt = Date.now()
        $('i-status').textContent = '正在下载壳更新安装包…'
        $('log').textContent = ''
        const bar = document.querySelector('#view-update .bar i')
        if (bar) { bar.style.animation = 'none'; bar.style.transform = 'none'; bar.style.width = '0%' }
      } else if (e.type === 'download-progress') {
        const bar = document.querySelector('#view-update .bar i')
        if (bar) bar.style.width = e.percent + '%'
        $('i-status').textContent = '正在下载壳更新安装包… ' + e.percent + '%（' +
          (e.got / 1048576).toFixed(1) + ' / ' + (e.total / 1048576).toFixed(1) + ' MB）'
      } else if (e.type === 'download-done') {
        phase = 'done'
        window.__shellFlow = true
        document.body.dataset.phase = 'done'
        $('d-latest').textContent = 'v' + ((window.__shellLatest && window.__shellLatest.latest) || '')
        $('d-meta').textContent = '安装包下载完成。点击下方按钮将自动关闭应用、静默安装并拉起新版；会话与设置不受影响。'
        $('b-restart').textContent = '安装并重启'
      } else if (e.type === 'download-failed') {
        phase = 'failed'
        document.body.dataset.phase = 'failed'
        $('x-detail').textContent = '壳更新下载失败：' + (e.error || '未知错误')
        $('x-log').textContent = '可返回重新检查更新后再试（GitHub 连接不稳定时会重试三次）。'
      }
    })
  }

  function backToNotes() {
    document.body.dataset.view = 'notes'
  }

  $('b-action').addEventListener('click', async () => {
    $('b-action').textContent = '检查中…'
    try {
      const r = await window.dshUpdate.checkUpdate()
      if (r && r.uptodate) {
        manualNotice = '已是最新版本 <span class="hl">v' + (r.current || '') +
          '</span>（已检查 latest / next / alpha 全部渠道）'
        $('status').innerHTML = manualNotice
      } else if (r && r.ok === false) {
        manualNotice = '<span class="err">检查更新失败：' + (r.error || '未知错误') + '</span>'
        $('status').innerHTML = manualNotice
      } else {
        manualNotice = ''
      }
      /* found / inProgress：主进程已把阶段事件推过来，界面自动切入更新视图 */
    } finally {
      $('b-action').textContent = '检查更新'
    }
  })

  /* 状态行里的新版本号可点：直接进更新视图（事件委托，状态行 3s 轮询重渲染不丢监听） */
  $('status').addEventListener('click', (e) => {
    if (e.target.classList && e.target.classList.contains('go-ver')) window.dshUpdate.openProgress()
  })
  $('b-back-f').addEventListener('click', backToNotes)
  $('b-back-i').addEventListener('click', backToNotes)
  $('b-back-d').addEventListener('click', backToNotes)
  $('b-back-x').addEventListener('click', backToNotes)
  $('b-hide').addEventListener('click', () => window.dshUpdate.close())
  /* done 视图的重启按钮按流程路由：壳流=静默安装并重启，运行时流=重启应用 */
  $('b-restart').addEventListener('click', () => {
    if (window.__shellFlow) window.dshUpdate.shellInstall()
    else window.dshUpdate.restart()
  })
  $('b-recheck-d').addEventListener('click', () => window.dshUpdate.recheck())
  $('b-recheck-x').addEventListener('click', () => window.dshUpdate.recheck())
  $('b-uclose').addEventListener('click', () => window.dshUpdate.close())
  $('b-close').addEventListener('click', () => window.close())

  /* 跟随应用主题：主进程在加载完成与主题变化时推送 { dark }，仅切换 data-theme 属性 */
  if (typeof window.dshUpdate.onNotesTheme === 'function') {
    window.dshUpdate.onNotesTheme((data) => {
      document.body.dataset.theme = data && data.dark ? 'dark' : 'light'
    })
  }

  init()
</script>
</body>
</html>
